name: Capture dark RuStore screenshots
on:
  push:
    branches: [codex/quran-reader-0814]
permissions:
  contents: read
  actions: read
concurrency:
  group: rustore-dark-media
  cancel-in-progress: false
jobs:
  media:
    if: ${{ contains(github.event.head_commit.message, '[rustore-dark]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the verified reader APK for real screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/build/outputs/apk/debug
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13045308679/zip" > app/build/outputs/apk/debug/app-debug.apk
          echo 'd1048c731153662808682401cfe48dc9e4638f5216bf0656ff7d4efacaefdb44  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c
          python3 -m py_compile tools/ci/rustore_media.py
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rustore.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/rustore_media.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.17-store-dark-media
          path: |
            ci-out/store/
            ci-out/crashes.txt
            ci-out/quran-failure.txt
            ci-out/last-ui.xml
