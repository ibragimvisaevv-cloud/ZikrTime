name: Restore original ZikrTime 0.8.28 (code 45)
on:
  push:
    branches: [codex/restore-0.8.28]
    paths: ['app/**', 'gradle/**', 'gradlew', 'gradlew.bat', 'build.gradle.kts', 'settings.gradle.kts', 'gradle.properties', '.github/workflows/restore-0828.yml']
permissions:
  contents: read
  actions: read
concurrency:
  group: restore-028-${{ github.ref }}
  cancel-in-progress: true
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      RESTORE_BASE: c451791056a717846adad432f5b9d5884729d27e
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Require original 0.8.28 sources with only the installable version code raised
        run: |
          python3 - <<'PY'
          import os, subprocess
          from pathlib import Path
          base = os.environ['RESTORE_BASE']
          path = 'app/build.gradle.kts'
          before = subprocess.check_output(['git', 'show', base + ':' + path], text=True)
          assert before.count('versionCode = 40') == 1
          assert Path(path).read_text() == before.replace('versionCode = 40', 'versionCode = 45')
          inputs = ['app', 'gradle', 'gradlew', 'gradlew.bat', 'build.gradle.kts',
                    'settings.gradle.kts', 'gradle.properties', 'keystore/release.jks.enc']
          changed = subprocess.check_output(['git', 'diff', '--name-only', base, 'HEAD', '--', *inputs], text=True).splitlines()
          assert changed == [path], ('Unexpected application/build changes', changed)
          print('Original 0.8.28 application sources verified; versionCode 40 -> 45 only.')
          PY
      - name: Restore the existing signing key and build the original interface
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
          bash gradlew assembleRelease --console=plain
      - name: Verify original certificate, version and all 128 protected assets
        run: |
          python3 - <<'PY'
          import hashlib, json, os, re, shutil, subprocess, zipfile
          from pathlib import Path
          apk = Path('app/build/outputs/apk/release/app-release.apk')
          tools = Path(os.environ['ANDROID_HOME']) / 'build-tools'
          def tool(name):
              return str(max(tools.glob('*/' + name), key=lambda p: tuple(map(int, re.findall(r'\d+', p.parent.name)))))
          def run(*args):
              return subprocess.check_output(args, text=True)
          signature = run(tool('apksigner'), 'verify', '--verbose', '--print-certs', str(apk))
          cert = '7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf'
          assert 'certificate SHA-256 digest: ' + cert in signature
          badging = run(tool('aapt'), 'dump', 'badging', str(apk))
          identity = re.search(r"package: name='([^']+)' versionCode='([^']+)' versionName='([^']+)'", badging)
          assert identity and identity.groups() == ('com.zikrtime.app', '45', '0.8.28')
          directories = ['app/src/main/assets/quran', 'app/src/main/assets/quran_audio', 'app/src/main/assets/quiz']
          protected = run('git', 'ls-tree', '-r', '--name-only', os.environ['RESTORE_BASE'], '--', *directories).splitlines()
          assert len(protected) == 128
          with zipfile.ZipFile(apk) as archive:
              for name in protected:
                  original = subprocess.check_output(['git', 'show', os.environ['RESTORE_BASE'] + ':' + name])
                  assert archive.read(name.removeprefix('app/src/main/')) == original, name
          output = Path('ZikrTime-0.8.28-restore-code45.apk')
          shutil.copyfile(apk, output)
          report = {'restored_source_commit': os.environ['RESTORE_BASE'], 'build_commit': os.environ['GITHUB_SHA'],
                    'build_run': os.environ['GITHUB_RUN_ID'], 'application_id': 'com.zikrtime.app',
                    'version_name': '0.8.28', 'version_code': 45, 'certificate_sha256': cert,
                    'only_android_source_change': 'versionCode 40 -> 45', 'protected_assets_verified': len(protected),
                    'apk_sha256': hashlib.sha256(output.read_bytes()).hexdigest(), 'apk_bytes': output.stat().st_size,
                    'ui_or_emulator_tests_run': False, 'on_device_update_tested': False, 'store_published': False}
          Path('ZikrTime-0.8.28-restore-code45-verification.json').write_text(json.dumps(report, indent=2) + '\n')
          print(json.dumps(report))
          PY
      - name: Remove decrypted signing material
        if: always()
        run: rm -f keystore/release.jks
      - uses: actions/upload-artifact@v4
        with:
          name: ZikrTime-0.8.28-restored-code45-APK
          compression-level: 0
          if-no-files-found: error
          path: |
            ZikrTime-0.8.28-restore-code45.apk
            ZikrTime-0.8.28-restore-code45-verification.json
