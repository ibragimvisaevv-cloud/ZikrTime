name: Prepare RuStore 0.8.17
on:
  push:
    branches: [codex/quran-reader-0814]
permissions:
  contents: read
  actions: read
concurrency:
  group: rustore-0817
  cancel-in-progress: false
jobs:
  signing:
    if: ${{ contains(github.event.head_commit.message, '[rustore-0817]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      ready: ${{ steps.key.outputs.ready }}
    steps:
      - uses: actions/checkout@v4
      - name: Check original certificate access
        id: key
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 tools/ci/rustore_signing.py probe
      - uses: actions/upload-artifact@v4
        with:
          name: RuStore-signing-check
          path: ci-store/signing.json
  release:
    needs: signing
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Reuse verified 0.8.17 application tests
        run: |
          git fetch --no-tags --depth=1 origin 22bed67f6863addaa1eed71f4bd563f1b6d00ad4
          git diff --exit-code 22bed67f6863addaa1eed71f4bd563f1b6d00ad4 HEAD -- app/ gradle/ gradlew gradlew.bat build.gradle.kts settings.gradle.kts gradle.properties tools/quran/ tools/i18n/ tools/quiz/ tools/audio/
          python3 -m py_compile tools/ci/rustore_signing.py tools/ci/rustore_verify.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Build release APK and check release lint
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: python3 tools/ci/rustore_signing.py build
      - name: Verify package, version, certificate and Quran bytes
        run: python3 tools/ci/rustore_verify.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.17-release-build
          path: |
            ci-store/
            app/build/outputs/mapping/release/
            app/build/reports/lint-results-release.*
      - uses: actions/upload-artifact@v7.0.2
        if: ${{ success() && needs.signing.outputs.ready == 'true' }}
        with:
          path: ci-store/ZikrTime-0.8.17-RuStore.apk
          archive: false
          if-no-files-found: error
  media:
    needs: signing
    runs-on: ubuntu-latest
    timeout-minutes: 18
    steps:
      - uses: actions/checkout@v4
      - name: Reuse the verified reader APK for real screenshots
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p app/build/outputs/apk/debug
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13045308679/zip" > app/build/outputs/apk/debug/app-debug.apk
          echo 'd1048c731153662808682401cfe48dc9e4638f5216bf0656ff7d4efacaefdb44  app/build/outputs/apk/debug/app-debug.apk' | sha256sum -c
          python3 -m py_compile tools/ci/rustore_media.py
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-rustore.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/rustore_media.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.17-store-media
          path: |
            ci-out/store/
            ci-out/crashes.txt
            ci-out/quran-failure.txt
            ci-out/last-ui.xml
