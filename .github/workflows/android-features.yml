name: Android My Day checks
on:
  push:
    branches: [codex/android-my-day-focus]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: android-features-${{ github.ref }}
  cancel-in-progress: true
jobs:
  bot-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: python3 -B shop-bot/test_bot.py
      - run: python3 -B shop-bot/test_miniapi.py
      - run: python3 -B shop-bot/test_place_corrections.py
      - run: node --check shop-bot/miniapp/app.js
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Generate and verify all Android translations
        run: |
          python3 tools/i18n/build_strings.py
          python3 tools/ci/check_strings.py
          python3 tools/quiz/build_quiz.py
          git diff --exit-code -- app/src/main/res/values*/strings.xml
          git diff --exit-code -- app/src/main/assets/quiz/
      - name: Restore existing release signature
        id: signing
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          signing_ready=false
          rm -f keystore/release.jks
          if [ -n "$RELEASE_KEY_PASSWORD" ] && \
             openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD 2>/dev/null && \
             keytool -list -keystore keystore/release.jks -storepass:env RELEASE_KEY_PASSWORD -alias zikrtime >/dev/null 2>&1; then
            signing_ready=true
          else
            rm -f keystore/release.jks
            echo '::warning::Release signing is unavailable. Tests continue with unsigned release outputs; these cannot update the installed release.'
          fi
          echo "ready=$signing_ready" >> "$GITHUB_OUTPUT"
      - name: Unit tests, Lint and APK/AAB
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --console=plain
      - name: Verify signing, versions and checksums
        env:
          SIGNING_READY: ${{ steps.signing.outputs.ready }}
        run: |
          mkdir -p app/build/reports
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          if [ "$SIGNING_READY" = true ]; then
            "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk | tee app/build/reports/android-signature.txt
            grep -q 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' app/build/reports/android-signature.txt
            jarsigner -verify app/build/outputs/bundle/release/app-release.aab > app/build/reports/aab-signature.txt
            grep -q 'jar verified.' app/build/reports/aab-signature.txt
          else
            test ! -e app/build/outputs/apk/release/app-release.apk
            test -f app/build/outputs/apk/release/app-release-unsigned.apk
            if "$SIGNER" verify app/build/outputs/apk/release/app-release-unsigned.apk > app/build/reports/android-signature.txt 2>&1; then
              echo '::error::Unexpected signature on an unsigned release build'; exit 1
            fi
            echo 'Unsigned AAB: no release-signature verification claimed.' > app/build/reports/aab-signature.txt
          fi
          python3 - <<'PY'
          import json, hashlib, pathlib, os, zipfile
          signed=os.environ['SIGNING_READY']=='true'
          metadata=json.loads(pathlib.Path('app/build/outputs/apk/release/output-metadata.json').read_text())
          assert metadata['applicationId']=='com.zikrtime.app'
          assert all(x['versionCode']==16 and x['versionName']=='0.8.4' for x in metadata['elements'])
          apk='app-release.apk' if signed else 'app-release-unsigned.apk'
          paths=[pathlib.Path('app/build/outputs/apk/release')/apk,pathlib.Path('app/build/outputs/bundle/release/app-release.aab')]
          if not signed:
              with zipfile.ZipFile(paths[1]) as bundle:
                  assert not any(n.upper().startswith('META-INF/') and n.upper().endswith(('.RSA','.DSA','.EC','.SF')) for n in bundle.namelist()), 'Unexpected signature on unsigned AAB'
          report={'sign_status':'signed' if signed else 'unsigned','files':{p.name:{'bytes':p.stat().st_size,'sha256':hashlib.sha256(p.read_bytes()).hexdigest()} for p in paths}}
          pathlib.Path('app/build/reports/release-files.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-features-build
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/outputs/mapping/
            app/build/reports/
            app/build/test-results/
  emulator:
    needs: [android, bot-tests]
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-features-build
          path: android-out
      - name: Retrieve previous Android UI build for migration fixture
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download 40476255211 -n Android-release-check -D previous-out
      - name: Prepare disposable same-signature debug upgrade fixtures
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          mkdir -p fixtures
          keytool -genkeypair -keystore fixtures/test.jks -storepass android -keypass android -alias test -dname 'CN=Disposable CI Upgrade Fixture' -keyalg RSA -keysize 2048 -validity 2
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" sign --ks fixtures/test.jks --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out fixtures/previous.apk previous-out/outputs/apk/debug/app-debug.apk
          "$SIGNER" sign --ks fixtures/test.jks --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out fixtures/current.apk android-out/outputs/apk/debug/app-debug.apk
          "$SIGNER" verify fixtures/previous.apk
          "$SIGNER" verify fixtures/current.apk
          bash tools/ci/build_focus_fixture.sh fixtures/test.jks fixtures/focus.apk
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install 'Pillow>=11,<13'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/features_smoke.sh fixtures/current.apk fixtures/previous.apk fixtures/focus.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-features-smoke
          path: ci-out/
