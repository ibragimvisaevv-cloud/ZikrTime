name: Сборка APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Собрать APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - uses: actions/upload-artifact@v4
        with:
          name: ZikrTime-apk
          path: app/build/outputs/apk/debug/*.apk

      # Каждая сборка из main публикуется во вкладке Releases — APK можно скачать прямо на телефон.
      - name: Опубликовать APK в Releases
        if: github.ref == 'refs/heads/main'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk "ZikrTime-${{ github.run_number }}.apk"
          gh release create "build-${{ github.run_number }}" "ZikrTime-${{ github.run_number }}.apk" \
            --title "Зикр-тайм, сборка ${{ github.run_number }}" \
            --notes "Установочный файл для Android. Скачайте ZikrTime-${{ github.run_number }}.apk на телефон и откройте его." \
            --latest
