name: Android tasbih preview
on:
  push:
    branches: [codex/tasbih-cosmos-0828]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'keystore/release.jks.enc'
      - 'tools/ci/tasbih_cosmos*'
      - '.github/workflows/tasbih-cosmos.yml'
permissions:
  contents: read
concurrency:
  group: tasbih-cosmos-${{ github.ref }}
  cancel-in-progress: true
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Reuse APKs when only the capture script changed
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          key: tasbih-apk-v1-${{ hashFiles('app/src/**', 'app/*.kts', 'app/*.pro', 'gradle/**', '*.kts', 'gradle.properties', 'gradlew*', 'keystore/release.jks.enc') }}
      - name: Assemble the two APKs using the existing signing key
        if: steps.apk.outputs.cache-hit != 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          trap 'rm -f keystore/release.jks' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
          bash gradlew :app:assembleDebug :app:assembleRelease --console=plain
      - name: Verify the installable signed package
        run: |
          set -eo pipefail
          mkdir -p ci-out/tasbih
          cp app/build/outputs/apk/release/app-release.apk ZikrTime-tasbih.apk
          sdk_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -type d | sort -V | tail -1)
          "$sdk_tools/apksigner" verify --print-certs ZikrTime-tasbih.apk > ci-out/tasbih/signature.txt
          grep -F 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' ci-out/tasbih/signature.txt
          "$sdk_tools/aapt" dump badging ZikrTime-tasbih.apk > ci-out/tasbih/badging.txt
          grep -F "package: name='com.zikrtime.app' versionCode='46' versionName='0.8.28'" ci-out/tasbih/badging.txt
          sha256sum ZikrTime-tasbih.apk > ci-out/tasbih/apk.sha256
      - name: Save verified APKs for capture-only retries
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZikrTime-tasbih-apk
          path: ZikrTime-tasbih.apk
          if-no-files-found: error
          compression-level: 0
      - name: Prepare guest audio, recording tools and KVM
        id: guest
        run: |
          if jps | grep -q GradleDaemon; then bash gradlew --stop; fi
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg pulseaudio pulseaudio-utils
          python3 -m pip install Pillow websocket-client numpy scipy
          arc="$RUNNER_TEMP/scrcpy-linux-x86_64-v3.3.4.tar.gz"
          curl -fsSL --retry 3 "https://github.com/Genymobile/scrcpy/releases/download/v3.3.4/scrcpy-linux-x86_64-v3.3.4.tar.gz" -o "$arc"
          echo "0305d98c06178c67e12427bbf340c436d0d58c9e2a39bf9ffbbf8f54d7ef95a5  $arc" | sha256sum -c -
          tar -xzf "$arc" -C "$RUNNER_TEMP"
          echo "SCRCPY_BIN=$RUNNER_TEMP/scrcpy-linux-x86_64-v3.3.4/scrcpy" >> "$GITHUB_ENV"
          echo "ADB=$ANDROID_HOME/platform-tools/adb" >> "$GITHUB_ENV"
          pulseaudio --start --exit-idle-time=-1
          sink=$(pactl load-module module-null-sink sink_name=tasbih)
          pactl set-default-sink tasbih
          echo "PULSE_SERVER=$(pactl info | sed -n 's/^Server String: //p')" >> "$GITHUB_ENV"
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-tasbih.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list > "$RUNNER_TEMP/tasbih-system-images.txt"
          if grep -q 'system-images;android-35;default;x86_64' "$RUNNER_TEMP/tasbih-system-images.txt"; then
            echo 'target=default' >> "$GITHUB_OUTPUT"
          else
            echo 'target=google_apis' >> "$GITHUB_OUTPUT"
          fi
      - name: Record real gestures and check count persistence on Android 15
        id: capture
        timeout-minutes: 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: ${{ steps.guest.outputs.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: false
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -feature -Vulkan -no-boot-anim -camera-back none -camera-front none
          script: python3 tools/ci/tasbih_cosmos_capture.py record
      - name: Check settings, gestures and reset on a fresh Android 15 instance
        if: ${{ !cancelled() && (steps.capture.outcome == 'success' || steps.capture.outcome == 'failure') }}
        timeout-minutes: 17
        uses: reactivecircus/android-emulator-runner@v2
        with:
          avd-name: tasbih_controls
          api-level: 35
          target: ${{ steps.guest.outputs.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -feature -Vulkan -no-boot-anim -camera-back none -camera-front none
          script: python3 tools/ci/tasbih_cosmos_capture.py controls
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-tasbih-capture
          path: |
            ci-out/tasbih/
            ci-out/last-ui.xml
          compression-level: 0
