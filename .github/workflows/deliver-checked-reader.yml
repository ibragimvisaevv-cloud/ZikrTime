name: Deliver checked Quran reader
on:
  push:
    branches: [codex/feedback-0816]
    paths: ['.github/workflows/deliver-checked-reader.yml']
permissions:
  contents: read
  actions: read
jobs:
  deliver:
    if: ${{ contains(github.event.head_commit.message, '[reader-file]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Verify the actual artifact download endpoint returns APK bytes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13012532970/zip" > ZikrTime-0.8.16-test.apk
          python3 - <<'PY'
          import hashlib, json, pathlib, zipfile
          apk = pathlib.Path('ZikrTime-0.8.16-test.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert apk.stat().st_size == 101913630, apk.stat().st_size
          assert digest == 'c8dc1028f6bbbf4d520ec06ab0cf5d077a9587c44ae3d5328c3082151e8dd3d2', digest
          with zipfile.ZipFile(apk) as z:
              names = set(z.namelist())
              assert 'AndroidManifest.xml' in names and 'classes.dex' in names
          print(json.dumps({'artifact': 13012532970, 'download_is_apk': True,
                            'size': apk.stat().st_size, 'sha256': digest, 'rebuilt': False}))
          PY
