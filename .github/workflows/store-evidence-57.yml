name: Transfer retained Android proof
on:
  push:
    branches: [ci/store-evidence-57]
    paths: [.github/workflows/store-evidence-57.yml]
permissions:
  contents: write
jobs:
  transfer:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Expose verifiable transfer chunks for the original screenshot
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          import base64, hashlib, json, os, subprocess
          from pathlib import Path
          png=Path('evidence/android57/03-daily-limit-block.png').read_bytes()
          assert hashlib.sha1(('blob '+str(len(png))+'\0').encode()+png).hexdigest() == '1a741bdf086c80e1437e58d351315146b506dfbf'
          for start in range(0,len(png),262144):
              data=base64.b64encode(png[start:start+262144]).decode('ascii')
              payload=json.dumps({'content':data,'encoding':'utf-8'}).encode()
              result=subprocess.check_output(['gh','api','-X','POST','repos/ibragimvisaevv-cloud/ZikrTime/git/blobs','--input','-'],input=payload)
              print(f"CHUNK {start} {json.loads(result)['sha']}",flush=True)
          PY
