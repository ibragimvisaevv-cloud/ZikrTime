name: Transfer three additional verified social limit screenshots
on:
  push:
    branches: [ci/store-evidence-57]
    paths: [.github/workflows/store-evidence-57.yml]
permissions:
  actions: read
  contents: write
jobs:
  extract:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          github-token: ${{ github.token }}
          repository: ibragimvisaevv-cloud/ZikrTime
          run-id: 44958811949
          artifact-ids: 14729350176
          path: ${{ runner.temp }}/screens
      - name: Verify, retain and relay original pixels
        env:
          GH_TOKEN: ${{ github.token }}
          SOURCE_DIR: ${{ runner.temp }}/screens
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import os, struct, hashlib, json, subprocess, base64
          from pathlib import Path
          source=Path(os.environ['SOURCE_DIR']); destination=Path('evidence/android57')
          for name in ('02-focus-setup.png','04-first-blocking-question.png','05-earned-ten-minutes.png'):
              matches=list(source.rglob(name)); assert len(matches)==1, (name, list(source.rglob('*.png')))
              content=matches[0].read_bytes(); assert content[:8]==b'\x89PNG\r\n\x1a\n'
              width,height=struct.unpack('>II',content[16:24]); assert 300<=width<height<=5000
              blob=hashlib.sha1(('blob '+str(len(content))+'\0').encode()+content).hexdigest()
              print('SOURCE',name,blob,width,height,flush=True)
              (destination/name).write_bytes(content)
              for start in range(0,len(content),262144):
                  data=base64.b64encode(content[start:start+262144]).decode('ascii')
                  payload=json.dumps({'content':data,'encoding':'utf-8'}).encode()
                  result=subprocess.check_output(['gh','api','-X','POST','repos/ibragimvisaevv-cloud/ZikrTime/git/blobs','--input','-'],input=payload)
                  print('CHUNK',name,start,json.loads(result)['sha'],flush=True)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- evidence/android57/02-focus-setup.png evidence/android57/04-first-blocking-question.png evidence/android57/05-earned-ten-minutes.png
          git commit -m "Retain setup, first quiz question and earned time from Android 57 run 44958811949 [skip ci]"
          git push origin HEAD:refs/heads/ci/store-evidence-57
