name: Natural Android UI recheck
on:
  push:
    branches: [codex/release-readiness-ios]
permissions:
  contents: read
  actions: read
jobs:
  emulator:
    if: contains(github.event.head_commit.message, '[reuse-android]')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Download previously built APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40476255211 -n Android-release-check -D android-out
          gh run download 40405870652 -n Android-release-check -D baseline-out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install 'Pillow>=11,<13'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/natural_smoke.sh android-out/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke
          path: ci-out/
