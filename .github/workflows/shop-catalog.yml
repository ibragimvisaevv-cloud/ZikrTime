name: Android shop catalog
on:
  push:
    branches: [codex/shop-catalog-0828]
    paths:
      - 'app/**'
      - 'gradle/**'
      - '*.kts'
      - 'gradle.properties'
      - 'gradlew*'
      - 'keystore/release.jks.enc'
      - 'tools/ci/shop_catalog_ui.py'
      - '.github/workflows/shop-catalog.yml'
permissions:
  contents: read
concurrency:
  group: shop-catalog-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Restore unchanged APKs for a UI-check retry
        id: apk
        uses: actions/cache/restore@v4
        with:
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          key: shop-catalog-apk-v1-${{ hashFiles('app/src/**', 'app/*.kts', 'app/*.pro', 'gradle/**', '*.kts', 'gradle.properties', 'gradlew*', 'keystore/release.jks.enc') }}
      - name: Build APKs with the existing signing key
        if: steps.apk.outputs.cache-hit != 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          trap 'rm -f keystore/release.jks' EXIT
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
          bash gradlew :app:testDebugUnitTest --tests com.zikrtime.app.data.ShopSearchTest :app:assembleDebug :app:assembleRelease --console=plain
      - name: Verify the installable release
        run: |
          set -euo pipefail
          mkdir -p ci-out/catalog
          cp app/build/outputs/apk/release/app-release.apk ZikrTime-0.8.28-catalog-49.apk
          sdk_tools=$(find "$ANDROID_HOME/build-tools" -maxdepth 1 -mindepth 1 -type d | sort -V | tail -1)
          "$sdk_tools/apksigner" verify --print-certs ZikrTime-0.8.28-catalog-49.apk > ci-out/catalog/signature.txt
          grep -F 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' ci-out/catalog/signature.txt
          "$sdk_tools/aapt" dump badging ZikrTime-0.8.28-catalog-49.apk > ci-out/catalog/badging.txt
          grep -F "package: name='com.zikrtime.app' versionCode='49' versionName='0.8.28'" ci-out/catalog/badging.txt
          sha256sum ZikrTime-0.8.28-catalog-49.apk > ci-out/catalog/apk.sha256
      - name: Cache the checked APKs
        if: steps.apk.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
          key: ${{ steps.apk.outputs.cache-primary-key }}
      - uses: actions/upload-artifact@v4
        with:
          name: ZikrTime-catalog-apk
          path: ZikrTime-0.8.28-catalog-49.apk
          compression-level: 0
          if-no-files-found: error
      - name: Prepare accelerated Android 15
        id: emulator
        run: |
          if jps | grep -q GradleDaemon; then bash gradlew --stop; fi
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-catalog.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --list > "$RUNNER_TEMP/catalog-system-images.txt"
          if grep -q 'system-images;android-35;default;x86_64' "$RUNNER_TEMP/catalog-system-images.txt"; then
            echo 'target=default' >> "$GITHUB_OUTPUT"
          else
            echo 'target=google_apis' >> "$GITHUB_OUTPUT"
          fi
      - name: Verify partner layout, company navigation, product search and filters
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: ${{ steps.emulator.outputs.target }}
          arch: x86_64
          profile: pixel_2
          ram-size: 2048M
          heap-size: 256M
          disable-animations: true
          emulator-options: -no-snapshot -no-window -gpu swiftshader_indirect -feature -Vulkan -no-boot-anim -noaudio -camera-back none -camera-front none
          script: python3 tools/ci/shop_catalog_ui.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-catalog-screens
          path: |
            ci-out/catalog/
            ci-out/last-ui.xml
          compression-level: 0
