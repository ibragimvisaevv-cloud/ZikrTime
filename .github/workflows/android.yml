name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверка переводов
        run: python3 tools/ci/check_strings.py

      - name: Тесты и сборка
        run: |
          chmod +x gradlew
          set -o pipefail
          mkdir -p ci-out
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee ci-out/gradle.log

      - name: Ошибки сборки — в ветку ci-build-log
        if: failure()
        run: |
          mkdir -p /tmp/blog && cd /tmp/blog
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" -A3 "$GITHUB_WORKSPACE/ci-out/gradle.log" | head -300 > errors.txt || true
          tail -150 "$GITHUB_WORKSPACE/ci-out/gradle.log" > tail.txt
          git init -q && git checkout -q -b ci-build-log && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build-log

      - name: Отчёты тестов
        if: always()
        run: |
          mkdir -p ci-out/tests
          cp -r app/build/test-results ci-out/tests/ 2>/dev/null || true
          ls -la app/build/outputs/apk/*/ > ci-out/apk-sizes.txt 2>/dev/null || true
          sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts > ci-out/version.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            ci-out/

  emulator:
    # Для мелких правок (тексты, документация) проверку на эмуляторе можно пропустить: [no-emu] в сообщении коммита
    if: ${{ !contains(github.event.head_commit.message, '[no-emu]') }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: build-out

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Эмулятор, установка и скриншоты
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          CI_RUN: ${{ github.run_number }}
          CI_SHA: ${{ github.sha }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 720x1520
          script: bash tools/ci/emulator_check.sh build-out

      - name: Сохранить результаты в ветку ci-artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp -r build-out/ci-out/. out/ 2>/dev/null || true
          cp -r ci-out/. out/ 2>/dev/null || true
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > out/RUN.txt
          cd out
          git init -q && git checkout -q -b ci-artifacts
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-artifacts

  release:
    # Публикуем APK только когда в сообщении коммита есть [release]
    if: contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch'
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: build-out

      - name: Опубликовать APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(cat build-out/ci-out/version.txt 2>/dev/null || echo "build")
          NAME="ZikrTime-${VERSION}-${{ github.run_number }}.apk"
          cp build-out/app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release create "v${VERSION}-${{ github.run_number }}" "$NAME" \
            --repo "${{ github.repository }}" \
            --title "Зикр-тайм ${VERSION} (сборка ${{ github.run_number }})" \
            --notes-file tools/ci/release_notes.md \
            --latest
