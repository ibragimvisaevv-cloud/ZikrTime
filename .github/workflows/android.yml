name: Android

on:
  push:
    branches: [main]
    paths-ignore: ["ios/**", "**.md"]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: gradle/actions/setup-gradle@v4

      - name: Проверка переводов
        run: python3 tools/ci/check_strings.py

      - name: Ключ подписи
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ -z "$RELEASE_KEY_PASSWORD" ]; then
            echo "::warning::Нет секрета RELEASE_KEY_PASSWORD — сборка подписана отладочным ключом и не будет опубликована"
            exit 0
          fi
          mkdir -p keystore ci-out
          exec > >(tee ci-out/signing.log) 2>&1
          if [ -f keystore/release.jks.enc ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
          else
            # Первый запуск: создаём новый ключ, шифруем паролем из секрета и сохраняем в репозиторий.
            keytool -genkeypair -v -keystore keystore/release.jks -alias zikrtime -keyalg RSA -keysize 4096 -validity 36500 \
              -storepass:env RELEASE_KEY_PASSWORD -keypass:env RELEASE_KEY_PASSWORD -dname "CN=ZikrTime, O=ZikrTime, C=RU"
            openssl enc -aes-256-cbc -salt -pbkdf2 -iter 300000 -in keystore/release.jks -out keystore/release.jks.enc -pass env:RELEASE_KEY_PASSWORD
            git config user.name ci && git config user.email ci@users.noreply.github.com
            git add keystore/release.jks.enc
            git commit -m "Зашифрованный ключ подписи [skip ci]"
            git pull --rebase origin ${{ github.ref_name }} && git push origin HEAD:${{ github.ref_name }}
          fi
          keytool -list -keystore keystore/release.jks -storepass:env RELEASE_KEY_PASSWORD | grep -i "SHA-256" || true
          mkdir -p ci-out && echo yes > ci-out/signed.txt

      - name: Тесты и сборка
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          set -o pipefail
          mkdir -p ci-out
          ./gradlew testDebugUnitTest assembleDebug assembleRelease --stacktrace 2>&1 | tee ci-out/gradle.log

      - name: Ошибки сборки — в ветку ci-build-log
        if: failure()
        run: |
          mkdir -p /tmp/blog && cd /tmp/blog
          grep -E "^e: |error:|What went wrong|Could not|FAILED|Exception" -A3 "$GITHUB_WORKSPACE/ci-out/gradle.log" | head -300 > errors.txt || true
          tail -150 "$GITHUB_WORKSPACE/ci-out/gradle.log" > tail.txt 2>/dev/null || true
          cp "$GITHUB_WORKSPACE/ci-out/signing.log" . 2>/dev/null || true
          date -u > when.txt
          git init -q && git checkout -q -b ci-build-log && git add -A
          git -c user.name=ci -c user.email=ci@local commit -qm "build log ${{ github.run_number }}"
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-build-log

      - name: Отчёты тестов
        if: always()
        run: |
          mkdir -p ci-out/tests
          cp -r app/build/test-results ci-out/tests/ 2>/dev/null || true
          ls -la app/build/outputs/apk/*/ > ci-out/apk-sizes.txt 2>/dev/null || true
          sed -n 's/.*versionName = "\(.*\)".*/\1/p' app/build.gradle.kts > ci-out/version.txt

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: build-out
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            ci-out/

  emulator:
    # Для мелких правок (тексты, документация) проверку на эмуляторе можно пропустить: [no-emu] в сообщении коммита
    # Эмулятор — самая долгая часть (до 50 минут). Только по [emu] в сообщении коммита или вручную.
    if: ${{ contains(github.event.head_commit.message, '[emu]') || github.event_name == 'workflow_dispatch' }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: build-out

      - name: Включить KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Эмулятор, установка и скриншоты
        uses: reactivecircus/android-emulator-runner@v2
        env:
          GH_TOKEN: ${{ github.token }}
          CI_REPO: ${{ github.repository }}
          CI_RUN: ${{ github.run_number }}
          CI_SHA: ${{ github.sha }}
        with:
          api-level: 34
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -skin 720x1520
          script: bash tools/ci/emulator_check.sh build-out

      - name: Сохранить результаты в ветку ci-artifacts
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p out && cp -r build-out/ci-out/. out/ 2>/dev/null || true
          cp -r ci-out/. out/ 2>/dev/null || true
          echo "run ${{ github.run_number }} commit ${{ github.sha }}" > out/RUN.txt
          cd out
          git init -q && git checkout -q -b ci-artifacts
          git add -A
          git -c user.name=ci -c user.email=ci@users.noreply.github.com commit -qm "CI ${{ github.run_number }}"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${{ github.repository }}.git" ci-artifacts

  release:
    # Публикуем APK только когда в сообщении коммита есть [release]
    if: >-
      !cancelled() && needs.build.result == 'success' &&
      (needs.emulator.result == 'success' || needs.emulator.result == 'skipped') &&
      (contains(github.event.head_commit.message, '[release]') || github.event_name == 'workflow_dispatch')
    needs: [build, emulator]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: build-out
          path: build-out

      - name: Опубликовать APK в Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Публикуем только сборку, подписанную постоянным ключом выпуска
          [ -f build-out/ci-out/signed.txt ] || { echo "::error::Нет секрета RELEASE_KEY_PASSWORD — APK не опубликован"; exit 1; }
          VERSION=$(cat build-out/ci-out/version.txt 2>/dev/null || echo "build")
          NAME="ZikrTime-${VERSION}-${{ github.run_number }}.apk"
          cp build-out/app/build/outputs/apk/release/app-release.apk "$NAME"
          gh release create "v${VERSION}-${{ github.run_number }}" "$NAME" \
            --repo "${{ github.repository }}" \
            --title "Зикр-тайм ${VERSION} (сборка ${{ github.run_number }})" \
            --notes-file tools/ci/release_notes.md \
            --latest
