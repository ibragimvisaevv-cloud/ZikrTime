name: Release checks
on:
  push:
    branches: [codex/release-readiness-ios]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  swift-logic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: swiftc --version && bash ios/Tests/linux_check.sh
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/ci/check_strings.py
      - name: Restore existing release key
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          if [ -n "$RELEASE_KEY_PASSWORD" ]; then
            openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
          fi
      - name: Tests, lint, APK and AAB
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest lintDebug assembleDebug assembleRelease bundleRelease --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-release-check
          path: |
            app/build/outputs/apk/
            app/build/outputs/bundle/
            app/build/outputs/mapping/
            app/build/reports/
            app/build/test-results/
  ios:
    runs-on: macos-26
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Xcode 26 and core regression tests
        run: |
          XC=$(ls -d /Applications/Xcode_26*.app | sort -V | tail -1)
          sudo xcode-select -s "$XC"
          xcodebuild -version
          bash ios/Tests/linux_check.sh
          python3 tools/ios/build_strings.py
          git diff --exit-code ios/ZikrTime/Resources
      - name: Generate project and install map SDK
        run: |
          brew install xcodegen cocoapods
          python3 tools/ios/configure.py
          cd ios
          xcodegen generate
          pod install
      - name: Build for iPhone simulator
        run: |
          mkdir -p ci-out
          set -o pipefail
          xcodebuild -workspace ios/ZikrTime.xcworkspace -scheme ZikrTime -configuration Debug -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' -derivedDataPath ios/build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-out/build.log
      - name: Run iPhone screens
        run: bash ios/ci/screens.sh
      - name: Build unsigned device IPA
        run: |
          set -o pipefail
          xcodebuild -workspace ios/ZikrTime.xcworkspace -scheme ZikrTime -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath ios/build-device CODE_SIGNING_ALLOWED=NO build 2>&1 | tee ci-out/build-device.log
          mkdir -p ios/ipa/Payload
          cp -R ios/build-device/Build/Products/Release-iphoneos/ZikrTime.app ios/ipa/Payload/
          (cd ios/ipa && zip -qry ../ZikrTime-0.8.3-unsigned.ipa Payload)
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: iPhone-release-check
          path: |
            ci-out/
            ios/*-unsigned.ipa
            ios/Podfile.lock
  emulator:
    needs: android
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-release-check
          path: android-out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/release_smoke.sh android-out/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-smoke
          path: ci-out/
