name: Android widgets
on:
  push:
    branches: [codex/android-natural-all]
    paths-ignore: ['design/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: widgets-${{ github.ref }}-${{ contains(github.event.head_commit.message, '[widgets]') && 'build' || 'other' }}
  cancel-in-progress: true
jobs:
  build:
    if: contains(github.event.head_commit.message, '[widgets]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/i18n/build_strings.py && python3 tools/ci/check_strings.py && git diff --exit-code -- app/src/main/res
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-widgets-build
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
  launcher:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: Android-widgets-build
          path: android-out
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-widgets.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install 'Pillow>=11,<13'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/widgets_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-widgets-launcher
          path: ci-out/
