name: Android widgets
on:
  push:
    branches: [codex/android-natural-all]
    paths-ignore: ['design/**', '**.md']
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: widgets-${{ github.ref }}-${{ github.sha }}
  cancel-in-progress: true
jobs:
  build:
    if: contains(github.event.head_commit.message, '[widgets]') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/i18n/build_strings.py && python3 tools/ci/check_strings.py && git diff --exit-code -- app/src/main/res
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-widgets-build
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
  launcher:
    if: ${{ always() && (needs.build.result == 'success' || contains(github.event.head_commit.message, '[widget-check]')) }}
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - name: Verify reused application inputs
        if: contains(github.event.head_commit.message, '[widget-check]')
        run: |
          git fetch --no-tags --depth=1 origin b1873848de9c09b226c30ed5a7ef2090746c2f99
          git diff --exit-code b1873848de9c09b226c30ed5a7ef2090746c2f99 HEAD -- app/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ gradlew tools/i18n/
      - uses: actions/download-artifact@v4
        with:
          name: Android-widgets-build
          path: android-out
          github-token: ${{ github.token }}
          run-id: ${{ contains(github.event.head_commit.message, '[widget-check]') && '41025914614' || github.run_id }}
      - name: Prepare upgrade fixture with disposable signing
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download 40922530810 -n Android-natural-build -D previous-out
          mkdir -p fixtures
          keytool -genkeypair -keystore fixtures/test.jks -storepass android -keypass android -alias test -dname 'CN=Disposable Widget Test' -keyalg RSA -keysize 2048 -validity 2
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" sign --ks fixtures/test.jks --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out fixtures/previous.apk previous-out/outputs/apk/debug/app-debug.apk
          "$SIGNER" sign --ks fixtures/test.jks --ks-key-alias test --ks-pass pass:android --key-pass pass:android --out fixtures/current.apk android-out/outputs/apk/debug/app-debug.apk
      - name: Build non-idle UI snapshot fixture
        run: |
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" 'platforms;android-35' 'build-tools;35.0.0' >/dev/null
          bash tools/ci/build_widget_ui.sh
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-widgets.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install 'Pillow>=11,<13'
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: WIDGET_CHECK_SCOPE=${{ contains(github.event.head_commit.message, '[widget-boot]') && 'boot' || contains(github.event.head_commit.message, '[widget-lifecycle]') && 'lifecycle' || contains(github.event.head_commit.message, '[widget-remaining]') && 'remaining' || 'full' }} bash tools/ci/widgets_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: Android-widgets-launcher
          path: ci-out/
