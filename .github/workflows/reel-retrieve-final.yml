name: Retrieve filmed Reels shots
on:
  push:
    branches: [media/zikrtime-reel-20261112]
    paths: ['.github/workflows/reel-retrieve-final.yml']
permissions:
  actions: read
  contents: write
jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download completed emulator recording
        uses: actions/download-artifact@v4
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 43249953721
          name: ZikrTime-reel-actual-interface
          path: /tmp/film
      - name: Prepare camera takes
        run: |
          python -m pip install Pillow -q
          python - <<'PY'
          from pathlib import Path
          from PIL import Image
          d=Path('reel-final-shots')
          d.mkdir(exist_ok=True)
          for p in Path('/tmp/film').rglob('*'):
            if not p.is_file():continue
            if p.suffix=='.png':
                im=Image.open(p).convert('RGB')
                im.thumbnail((850,1550))
                q=Path('/tmp')/(p.stem+'.jpg')
                im.save(q,quality=91)
            elif p.suffix in ('.mp4','.xml','.json','.txt'):
                q=p
            else:continue
            content=q.read_bytes()
            for seq,pos in enumerate(range(0,len(content),64000)):
                (d/(q.name+'.part%03d'%seq)).write_bytes(content[pos:pos+64000])
          PY
          git config user.name github-actions
          git config user.email github-actions@users.noreply.github.com
          git add reel-final-shots
          git commit -m 'Collect the completed Android camera takes for film editing'
          git push origin HEAD:media/zikrtime-reel-20261112 || (git pull --rebase --autostash origin media/zikrtime-reel-20261112 && git push origin HEAD:media/zikrtime-reel-20261112)
