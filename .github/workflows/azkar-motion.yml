name: Azkar and motion check
on:
  push:
    branches: [codex/azkar-motion-0813]
    paths-ignore: ['**.md', 'design/**']
permissions:
  contents: read
concurrency:
  group: azkar-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - run: python3 tools/i18n/build_strings.py && python3 tools/ci/check_strings.py && git diff --exit-code -- app/src/main/res
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-azkar.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/azkar_motion_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.13-check
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            ci-out/
