name: Azkar and motion check
on:
  push:
    branches: [codex/azkar-motion-0813]
    paths-ignore: ['**.md', 'design/**']
permissions:
  contents: read
  actions: read
concurrency:
  group: azkar-motion-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        if: ${{ !contains(github.event.head_commit.message, '[reuse-azkar]') }}
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !contains(github.event.head_commit.message, '[reuse-azkar]') }}
      - run: python3 tools/i18n/build_strings.py && python3 tools/ci/check_strings.py && git diff --exit-code -- app/src/main/res
      - run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
        if: ${{ !contains(github.event.head_commit.message, '[reuse-azkar]') }}
      - name: Verify unchanged APK inputs
        if: contains(github.event.head_commit.message, '[reuse-azkar]')
        run: |
          git fetch --no-tags --depth=1 origin 07747b02238e87a31502174c3c0e8368d1560ea4
          git diff --exit-code 07747b02238e87a31502174c3c0e8368d1560ea4 HEAD -- app/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ gradlew tools/i18n/
      - uses: actions/download-artifact@v4
        if: contains(github.event.head_commit.message, '[reuse-azkar]')
        with:
          name: ZikrTime-0.8.13-check
          github-token: ${{ github.token }}
          run-id: 41075095882
          path: reuse-out
      - name: Reuse compiled APK and reports
        if: contains(github.event.head_commit.message, '[reuse-azkar]')
        run: cp -r reuse-out/app/build app/
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-azkar.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/azkar_motion_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.13-check
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            ci-out/
