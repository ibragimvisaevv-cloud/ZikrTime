name: Publish verified Android natural preview
on:
  push:
    branches: [codex/release-readiness-ios]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-android-natural-1
  cancel-in-progress: false
jobs:
  publish:
    if: contains(github.event.head_commit.message, '[publish-natural]')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check publishing access is configured
        env:
          PUBLISH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          if [ -z "$PUBLISH_TOKEN" ]; then
            echo '::error::Add RELEASE_PUBLISH_TOKEN for ZikrTime with Contents and Workflows read/write. Do not paste the token into chat.'
            exit 1
          fi
      - name: Retrieve verified artifacts without rebuilding
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40476255211 --jq .head_sha)" = 44d122e8870ea545001d18c289b8992b485b0d72
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40476255211/jobs --jq '.jobs[] | select(.name == "android") | .conclusion')" = success
          test "$(gh api repos/$GITHUB_REPOSITORY/actions/runs/40477863659 --jq .conclusion)" = success
          gh run download 40476255211 -n Android-release-check -D release-in
          gh run download 40477863659 -n Android-smoke -D smoke-in
          cp release-in/outputs/apk/release/app-release.apk ZikrTime-0.8.3-natural.apk
          cp release-in/outputs/bundle/release/app-release.aab ZikrTime-0.8.3-natural.aab
          echo 'b8ca7a7fe7be69dd07841c03d63fba176293a10accd2c67b417c16a9960ce74b  ZikrTime-0.8.3-natural.apk' > SHA256SUMS.txt
          echo 'bba6703ba1d7a3cce8dd011f86d050c1557136cbafccffab967ff0fc14fdefe5  ZikrTime-0.8.3-natural.aab' >> SHA256SUMS.txt
          sha256sum -c SHA256SUMS.txt
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --print-certs ZikrTime-0.8.3-natural.apk > signature.txt
          grep -q 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' signature.txt
          python3 tools/ci/package_natural_evidence.py
          sha256sum ZikrTime-0.8.3-natural-evidence.zip >> SHA256SUMS.txt
      - name: Publish APK and evidence to GitHub Releases
        env:
          GH_TOKEN: ${{ secrets.RELEASE_PUBLISH_TOKEN }}
        run: |
          set -euo pipefail
          gh release create v0.8.3-natural.1 \
            ZikrTime-0.8.3-natural.apk ZikrTime-0.8.3-natural.aab \
            ZikrTime-0.8.3-natural-evidence.zip SHA256SUMS.txt \
            --prerelease --latest=false --target 44d122e8870ea545001d18c289b8992b485b0d72 \
            --title 'Зикр-тайм 0.8.3 — новая главная и тасбих (тест)' \
            --notes-file docs/ANDROID_NATURAL_GITHUB_NOTES.md
      - name: Verify the public download
        run: |
          curl --fail --location --retry 3 --output public.apk https://github.com/ibragimvisaevv-cloud/ZikrTime/releases/download/v0.8.3-natural.1/ZikrTime-0.8.3-natural.apk
          echo 'b8ca7a7fe7be69dd07841c03d63fba176293a10accd2c67b417c16a9960ce74b  public.apk' | sha256sum -c -
