name: Camera stream on verified 0.8.23 APK
on:
  push:
    branches: [codex/quran-reader-0814]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: design-camera-${{ github.ref }}
  cancel-in-progress: false
jobs:
  camera:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[design-camera]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve exact APKs and completed checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13573813708" > ci-out/reused-artifact.json
          gh run download 42372494277 -n design-verified-inputs -D verified-inputs
          gh run download 42372494277 -n ZikrTime-0.8.23-check -D previous-check
          python3 tools/ci/design_reuse.py
          # This evidence run contains only freshly captured camera screens.
          find ci-out/screens ci-out/miniapp -maxdepth 1 -type f -delete
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-design-camera.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Verify camera streaming and permissions on Android 15
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back emulated -camera-front none
          script: |
            adb wait-for-device
            adb shell svc power stayon true
            adb shell input keyevent KEYCODE_WAKEUP
            adb shell wm dismiss-keyguard
            adb shell wm size 1080x1920
            adb shell wm density 420
            adb logcat -c
            adb install -r app/build/outputs/apk/debug/app-debug.apk
            python3 tools/ci/design_journeys.py --flow camera
      - name: Preserve camera evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/design_evidence.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.23-camera
          path: ci-out/
          if-no-files-found: error
