name: Quran reader UI recheck
on:
  push:
    branches: [codex/quran-reader-0814]
permissions:
  contents: read
  actions: read
concurrency:
  group: quran-ui-${{ github.ref }}
  cancel-in-progress: true
jobs:
  emulator:
    if: ${{ contains(github.event.head_commit.message, '[quran-ui]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Verify unchanged Android inputs and retrieve the tested APK
        env:
          GH_TOKEN: ${{ github.token }}
          BUILD_SOURCE_SHA: 8e37ce2ff975566a33c119d01c8087af448fd4e9
        run: |
          mkdir -p ci-out
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13001256142" > ci-out/reused-artifact.json
          python3 - <<'PY'
          import json, os, pathlib
          artifact = json.loads(pathlib.Path('ci-out/reused-artifact.json').read_text())
          assert artifact['id'] == 13001256142 and artifact['name'] == 'ZikrTime-0.8.14-check'
          assert not artifact['expired'], 'Tested build artifact has expired'
          assert artifact['workflow_run']['id'] == 41103686197
          assert artifact['workflow_run']['head_sha'] == os.environ['BUILD_SOURCE_SHA']
          PY
          git fetch --no-tags --depth=1 origin "$BUILD_SOURCE_SHA"
          git diff --exit-code "$BUILD_SOURCE_SHA" HEAD -- app/ tools/i18n/ tools/quiz/ tools/quran/ tools/audio/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ gradlew gradlew.bat .gitattributes
          printf '%s\n' "$BUILD_SOURCE_SHA" > ci-out/reused-build-source.txt
          gh run download 41103686197 -n ZikrTime-0.8.14-check -D reused-check
          mkdir -p app/build
          cp -R reused-check/app/build/outputs reused-check/app/build/reports reused-check/app/build/test-results app/build/
          sha256sum app/build/outputs/apk/debug/app-debug.apk > ci-out/reused-apk-sha256.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, xml.etree.ElementTree as ET
          apk = pathlib.Path('app/build/outputs/apk/debug/app-debug.apk')
          digest = hashlib.sha256(apk.read_bytes()).hexdigest()
          assert digest == '2017852bc78a81ade41788103db8d07608d1276f3d3377ea8ae661b20aa4c811', 'APK differs from the checked build'
          tests = [ET.parse(p).getroot() for p in pathlib.Path('app/build/test-results/testDebugUnitTest').glob('TEST-*.xml')]
          count = sum(int(t.get('tests', 0)) for t in tests)
          assert count == 75, 'Expected complete unit-test reports from the pinned build'
          assert all(int(t.get('failures', 0)) == 0 and int(t.get('errors', 0)) == 0 and int(t.get('skipped', 0)) == 0 for t in tests)
          lint = ET.parse('app/build/reports/lint-results-debug.xml')
          assert not any(issue.get('severity') in ('Error', 'Fatal') for issue in lint.iter('issue'))
          pathlib.Path('ci-out/reused-build-verification.json').write_text(json.dumps({
              'run_id': 41103686197, 'artifact_id': 13001256142,
              'source_sha': os.environ['BUILD_SOURCE_SHA'], 'apk_sha256': digest,
              'passed_unit_tests': count, 'lint_errors': 0,
          }, indent=2))
          PY
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-quran.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Quran and adhan journeys on Android 15
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        env:
          QURAN_QA_MODE: ${{ contains(github.event.head_commit.message, '[quran-tail]') && 'navigation-adhan' || 'all' }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/quran_reader_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.14-UI-check
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            ci-out/
