name: Save verified design evidence
on:
  push:
    branches: [codex/android-natural-all]
    paths: ['tools/ci/publish_design_evidence.py', '.github/workflows/design-evidence.yml']
permissions:
  contents: write
  actions: read
jobs:
  gallery:
    if: contains(github.event.head_commit.message, '[design-evidence]')
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Collect exact existing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 tools/ci/publish_design_evidence.py
      - name: Preserve gallery on the working branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add design/review-0811
          if ! git diff --cached --quiet; then
            git commit -m 'docs: preserve verified Android 0.8.11 screenshots and recordings'
            git push origin HEAD:codex/android-natural-all
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: ZikrTime-0.8.11-APK
          path: preview-apk/
      - uses: actions/upload-artifact@v4
        with:
          name: ZikrTime-0.8.11-evidence
          path: evidence/
