name: 0.8.21 UI compilation checkpoint
on:
  push:
    branches: [codex/learning-topics-0821-check]
permissions:
  contents: read
jobs:
  compile:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Compile the integrated UI while content translation is completed
        run: chmod +x gradlew && ./gradlew compileDebugKotlin --console=plain
