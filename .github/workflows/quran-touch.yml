name: Quran touch reading check
on:
  push:
    branches: [codex/quran-reader-0814]
permissions:
  contents: write
concurrency:
  group: quran-touch-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ contains(github.event.head_commit.message, '[reader-touch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Preserve exact Quran source bytes and validate new translations
        run: |
          python3 tools/quran/import_quran.py --build
          git diff --exit-code -- app/src/main/assets/quran app/src/main/java/com/zikrtime/app/data/QuranContent.kt
          python3 -m py_compile tools/ci/quran_touch_ui.py
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          res = pathlib.Path('app/src/main/res')
          for file in ['quran_touch.xml', 'quran_features.xml']:
              def read(folder):
                  return {x.get('name'): x.text for x in ET.parse(res / folder / file).getroot()}
              base = read('values')
              for lang in ['ru', 'uz', 'tg', 'kk', 'ky', 'az', 'tr']:
                  actual = read('values-' + lang)
                  assert base.keys() == actual.keys(), (file, lang)
                  for key in base:
                      assert sorted(re.findall(r'%\d+\$[ds]', base[key])) == sorted(re.findall(r'%\d+\$[ds]', actual[key])), (lang, key)
          print('Reader resources checked in all 8 languages')
          PY
      - name: Focused Quran tests, lint and test APK
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests '*Quran*' lintDebug assembleDebug --console=plain
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-quran.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Gesture and passive reading journeys on Android 15
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QURAN_QA_MODE=touch bash tools/ci/quran_reader_smoke.sh
      - name: Keep focused evidence available
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          READER_EVIDENCE_VERSION: '0817'
        run: python3 tools/ci/reader_evidence.py
      - name: Prepare APK
        if: success()
        run: cp app/build/outputs/apk/debug/app-debug.apk ZikrTime-0.8.17-test.apk
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          path: ZikrTime-0.8.17-test.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.17-check
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            ci-out/
