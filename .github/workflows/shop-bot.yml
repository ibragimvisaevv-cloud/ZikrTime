# Бот-кабинет продавцов магазина: проверка и развёртывание.
# Бот работает на Vercel (вне России — там доступен Telegram), данные и фото — в Yandex Object Storage.
# Нужны секреты: VERCEL_TOKEN, YC_SA_KEY (авторизованный ключ сервисного аккаунта, JSON), YC_FOLDER_ID, SHOP_BOT_TOKEN,
# и по желанию SHOP_OWNER_USERNAME — Telegram-имя владельца (станет владельцем при первом сообщении боту).
name: Shop bot

on:
  push:
    branches: [main, codex/quran-reader-0814]
    paths: ["shop-bot/**", ".github/workflows/shop-bot.yml"]
  workflow_dispatch:
  # Раз в месяц обновляем мечети и молельные комнаты из OpenStreetMap
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: shop-bot
  cancel-in-progress: false

env:
  BUCKET: zikrtime-shop
  FUNCTION: shop-bot
  RUNTIME_SA: shop-bot-runtime

jobs:
  test:
    if: ${{ github.ref == 'refs/heads/main' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[bot-release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка бота
        run: python3 shop-bot/test_bot.py

      - name: Проверка обращений и исправлений
        run: |
          python3 shop-bot/test_feedback.py
          python3 shop-bot/test_place_corrections.py

      - name: Проверка API кабинета
        run: |
          python3 shop-bot/test_miniapi.py
          python3 shop-bot/test_acquiring.py
          python3 shop-bot/test_robokassa.py
          python3 shop-bot/test_community.py
          python3 shop-bot/test_places_sources.py
          python3 shop-bot/test_import_publication.py
          python3 shop-bot/test_upload_miniapp.py

      - name: Проверка мини-приложения (синтаксис)
        run: node --check shop-bot/miniapp/app.js

      - name: Mini App browser journeys
        env:
          NODE_PATH: ${{ runner.temp }}/miniapp-qa/node_modules
        run: |
          npm install --prefix "$RUNNER_TEMP/miniapp-qa" playwright
          "$RUNNER_TEMP/miniapp-qa/node_modules/.bin/playwright" install --with-deps chromium
          node tools/ci/miniapp_design_check.cjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: MiniApp-0.8.23-ui
          path: ci-out/miniapp/

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли ключи
        id: keys
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p diag
          if [ -z "$YC_SA_KEY" ] || [ -z "$YC_FOLDER_ID" ] || [ -z "$SHOP_BOT_TOKEN" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "нет секретов: $( [ -z "$VERCEL_TOKEN" ] && echo VERCEL_TOKEN )" > diag/keys.txt
            echo "### Бот не развёрнут: добавьте секреты VERCEL_TOKEN, YC_SA_KEY, YC_FOLDER_ID, SHOP_BOT_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Yandex Cloud CLI
        if: steps.keys.outputs.ready == 'true'
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          RAW_FOLDER: ${{ secrets.YC_FOLDER_ID }}  # не YC_FOLDER_ID: эту переменную yc читает сам
        run: |
          mkdir -p diag
          # Проверка ключа без вывода секретов: только имена полей и длины
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/key.json"
          python3 - "$RUNNER_TEMP/key.json" > diag/key-check.txt 2>&1 <<'PY' || true
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8-sig").read()
          print("длина ключа:", len(raw), "начало:", repr(raw.strip()[:1]), "конец:", repr(raw.strip()[-1:]))
          try:
              k = json.loads(raw)
              print("поля:", sorted(k.keys()))
              print("private_key начинается правильно:", str(k.get("private_key", "")).lstrip().startswith("PLEASE DO NOT REMOVE") or "BEGIN PRIVATE KEY" in str(k.get("private_key", "")))
          except Exception as e:
              print("не JSON:", type(e).__name__, str(e)[:120])
          PY
          # Ключ, скопированный с телефона, бывает с настоящими переносами строк внутри — чиним (strict=False)
          python3 -c "import json,sys;k=json.loads(open(sys.argv[1],encoding='utf-8-sig').read(),strict=False);json.dump(k,open(sys.argv[1],'w'));print('ключ исправлен и прочитан')" "$RUNNER_TEMP/key.json" >> diag/key-check.txt 2>&1 || true
          # В ID каталога могли вставить ссылку целиком — берём то, что после /folders/
          FOLDER=$(python3 -c "import re,sys;t=sys.argv[1].strip();m=re.search(r'folders/([a-z0-9]+)',t);print(m.group(1) if m else re.sub(r'[^a-z0-9]','',t))" "$RAW_FOLDER")
          echo "FOLDER=$FOLDER" >> "$GITHUB_ENV"
          echo "folder id: длина ${#FOLDER}, начало ${FOLDER:0:3}" >> diag/key-check.txt
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n > diag/install.txt 2>&1
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
          YC="$HOME/yc/bin/yc"
          $YC config profile create ci > diag/yc.txt 2>&1
          $YC config set service-account-key "$RUNNER_TEMP/key.json" >> diag/yc.txt 2>&1
          $YC config set folder-id "$FOLDER" >> diag/yc.txt 2>&1
          $YC resource-manager folder get "$FOLDER" --format json 2>&1 | python3 -c "import sys,json
          t=sys.stdin.read()
          try: print('каталог найден:', json.loads(t).get('name'))
          except Exception: print('ошибка доступа к каталогу:', t[:400])" >> diag/yc.txt

      - name: Хранилище (фото и каталог)
        if: steps.keys.outputs.ready == 'true'
        run: |
          yc storage bucket get --name "$BUCKET" > /dev/null
          yc storage bucket get --name "$BUCKET-data" > /dev/null
          echo "Existing public and private buckets found." > diag/bucket.txt
          for PRIVATE_PATH in "$BUCKET/data/db.json" "$BUCKET-data/data/db.json"; do
            STATUS=$(curl -s -I -m 30 -o /dev/null -w '%{http_code}' "https://storage.yandexcloud.net/$PRIVATE_PATH")
            echo "$PRIVATE_PATH http: $STATUS" >> diag/bucket.txt
            test "$STATUS" = 403 || test "$STATUS" = 404
          done

      - name: Сервисный аккаунт функции
        if: steps.keys.outputs.ready == 'true'
        run: |
          SA_ID=$(yc iam service-account get --name "$RUNTIME_SA" --format json 2>> diag/sa.txt | jq -r .id)
          test -n "$SA_ID" && test "$SA_ID" != null
          echo "sa id length: ${#SA_ID}" >> diag/sa.txt
          echo "SA_ID=$SA_ID" >> "$GITHUB_ENV"

      - name: Ключ доступа к хранилищу для бота
        if: steps.keys.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          export IAM_TOKEN=$(yc iam create-token)
          python3 shop-bot/deploy_storage_key.py

      - name: API кабинета продавца (функция Яндекса — открывается из России без VPN)
        if: steps.keys.outputs.ready == 'true'
        env:
          PRESERVE_PAYMENT_CONFIG: 'true'
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          TBANK_TERMINAL: ${{ secrets.TBANK_TERMINAL }}
          PAYMENT_PROVIDER: ${{ vars.PAYMENT_PROVIDER }}
          ROBOKASSA_ENABLED: ${{ vars.ROBOKASSA_ENABLED }}
          ROBOKASSA_MERCHANT_LOGIN: ${{ secrets.ROBOKASSA_MERCHANT_LOGIN }}
          ROBOKASSA_PASSWORD1: ${{ secrets.ROBOKASSA_PASSWORD1 }}
          ROBOKASSA_PASSWORD2: ${{ secrets.ROBOKASSA_PASSWORD2 }}
          ROBOKASSA_TEST_PASSWORD1: ${{ secrets.ROBOKASSA_TEST_PASSWORD1 }}
          ROBOKASSA_TEST_PASSWORD2: ${{ secrets.ROBOKASSA_TEST_PASSWORD2 }}
          ROBOKASSA_TEST_MODE: ${{ vars.ROBOKASSA_TEST_MODE }}
          ROBOKASSA_HASH: ${{ vars.ROBOKASSA_HASH }}
          ROBOKASSA_NPD_RECEIPTS: ${{ vars.ROBOKASSA_NPD_RECEIPTS }}
          TBANK_ENABLED: ${{ vars.TBANK_ENABLED }}
          TBANK_PASSWORD: ${{ secrets.TBANK_PASSWORD }}
          TBANK_TAXATION: ${{ vars.TBANK_TAXATION }}
          TBANK_TAX: ${{ vars.TBANK_TAX }}
          SELLER_OFFER_URL: ${{ vars.SELLER_OFFER_URL }}
        run: |
          export IAM_TOKEN=$(yc iam create-token)
          export SA_ID FOLDER BUCKET S3_KEY_ID S3_SECRET API_FUNCTION=shop-api DATA_BUCKET="$BUCKET-data"
          URL=$(python3 shop-bot/deploy_api.py 2> diag/api.txt) || { cat diag/api.txt; exit 1; }
          echo "API_URL=$URL" >> "$GITHUB_ENV"
          echo "api: $URL" >> diag/api.txt

      - name: Мини-приложение и политика конфиденциальности в хранилище
        if: steps.keys.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          sleep 10  # новый ключ хранилища начинает работать не сразу
          python3 shop-bot/upload_miniapp.py > diag/miniapp.txt 2>&1 || { cat diag/miniapp.txt; exit 1; }
          cat diag/miniapp.txt

      - name: Бот на Vercel
        if: steps.keys.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.SHOP_OWNER_USERNAME }}
        run: |
          export IAM_TOKEN=$(yc iam create-token)
          python3 shop-bot/deploy_feedback.py
          FUNCTION_URL=$(python3 -c "import json;print(json.load(open('ci-out/feedback-deploy.json'))['webhook'])")
          echo "FUNCTION_URL=$FUNCTION_URL" >> "$GITHUB_ENV"
          cp ci-out/feedback-deploy.json diag/vercel-deploy.json

      - name: Обновление карточек и сверка каталога приложения
        if: steps.keys.outputs.ready == 'true'
        run: |
          set -euo pipefail
          export DATA_BUCKET="$BUCKET-data"
          python3 shop-bot/publish_companies.py | tee diag/company-publication.json
          jq -e '.public_catalog_matches == true' diag/company-publication.json > /dev/null

      - name: Подключение к Telegram
        if: steps.keys.outputs.ready == 'true'
        env:
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.SHOP_OWNER_USERNAME }}
        run: |
          SECRET=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':webhook').encode()).hexdigest()[:32])")
          API="https://api.telegram.org/bot$SHOP_BOT_TOKEN"
          curl -s "$API/setWebhook" -H 'Content-Type: application/json' -d "{\"url\":\"$FUNCTION_URL\",\"secret_token\":\"$SECRET\",\"max_connections\":1,\"allowed_updates\":[\"message\",\"callback_query\"]}" > diag/webhook.txt
          grep -q '"ok":true' diag/webhook.txt
          for SCOPE in default all_private_chats all_group_chats all_chat_administrators; do
            curl -sf "$API/deleteMyCommands" -H 'Content-Type: application/json' -d "{\"scope\":{\"type\":\"$SCOPE\"}}" > /dev/null
          done
          curl -sf "$API/setMyDescription" -H 'Content-Type: application/json' \
            -d '{"description":"Кабинет «Зикр-тайм»: компании и товары, продвижение, сообщения об ошибках, предложения и места для намаза."}' > /dev/null
          curl -sf "$API/setMyShortDescription" -H 'Content-Type: application/json' \
            -d '{"short_description":"Ваш кабинет в «Зикр-тайм»"}' > /dev/null
          # Кнопка «Кабинет» слева от поля ввода — открывает мини-приложение
          curl -sf "$API/setChatMenuButton" -H 'Content-Type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Кабинет\",\"web_app\":{\"url\":\"https://storage.yandexcloud.net/$BUCKET/miniapp/index.html\"}}}" > diag/menubutton.txt || echo "menu button: fail" > diag/menubutton.txt
          BOT=$(curl -sf "$API/getMe" | jq -r .result.username)
          echo "bot=$BOT" > diag/bot.txt
          echo "webhook=$FUNCTION_URL" >> diag/bot.txt
          [ -n "$OWNER_USERNAME" ] && echo "owner=by_username" >> diag/bot.txt || echo "owner=existing_database" >> diag/bot.txt
          {
            echo "### ✅ Бот @$BOT работает"
            echo ""
            echo "Вход владельца — через существующий аккаунт Telegram и личный кабинет."
            echo ""
            echo "Каталог для приложения: https://storage.yandexcloud.net/$BUCKET/catalog.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Мечети и молельные комнаты из OpenStreetMap
        if: steps.keys.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[places-refresh]'))
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          sleep 15  # новый ключ хранилища начинает работать не сразу
          python3 shop-bot/import_osm.py 2>&1 | tail -5 | tee diag/osm.txt

      - name: Дополнительные сведения Wikidata и кандидаты мест
        if: steps.keys.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[places-refresh]'))
        continue-on-error: true
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: python3 shop-bot/import_wikidata.py 2>&1 | tail -5 | tee diag/wikidata.txt

      - name: Проверенные мечети Беркат-Юрта
        if: steps.keys.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[places-refresh]'))
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          export DATA_BUCKET="$BUCKET-data"
          python3 shop-bot/import_curated.py 2>&1 | tee diag/curated.txt

      - name: Проверка опубликованных файлов и защиты данных
        if: steps.keys.outputs.ready == 'true'
        run: |
          for FILE in catalog.json places.json privacy.html seller.html; do
            STATUS=$(curl -s -m 30 -o /dev/null -w '%{http_code}' "https://storage.yandexcloud.net/$BUCKET/$FILE")
            echo "$FILE http: $STATUS" >> diag/published.txt
            test "$STATUS" = 200
          done
          python3 - <<'PY' > diag/published-assets.txt
          import hashlib, os, re, urllib.request
          from html.parser import HTMLParser
          base = 'https://storage.yandexcloud.net/' + os.environ['BUCKET'] + '/miniapp/'
          class Assets(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.paths = []
              def handle_starttag(self, tag, pairs):
                  attributes = dict(pairs)
                  if tag == 'script' and attributes.get('src'):
                      self.paths.append(attributes['src'])
                  if tag == 'link' and attributes.get('rel') == 'stylesheet':
                      self.paths.append(attributes.get('href', ''))
          parser = Assets()
          with urllib.request.urlopen(base + 'index.html', timeout=30) as response:
              parser.feed(response.read().decode('utf-8'))
          found = set()
          for name in parser.paths:
              if name == 'https://telegram.org/js/telegram-web-app.js':
                  print('Telegram SDK uses its official remote URL.')
                  continue
              match = re.fullmatch(r'(app|style|config|telegram-web-app)\.([0-9a-f]{64})\.(js|css)', name)
              if not match:
                  raise SystemExit('Unexpected asset reference in published Mini App index.')
              with urllib.request.urlopen(base + name, timeout=30) as response:
                  body = response.read()
              if hashlib.sha256(body).hexdigest() != match.group(2):
                  raise SystemExit('Published Mini App asset digest mismatch.')
              found.add(match.group(1))
              print(name + ' SHA-256 verified')
          if not {'app', 'style', 'config'}.issubset(found):
              raise SystemExit('Published Mini App index is incomplete.')
          print('Published Mini App index and referenced assets verified.')
          PY
          cat diag/published-assets.txt
          for PRIVATE_PATH in "$BUCKET/data/db.json" "$BUCKET-data/data/db.json"; do
            STATUS=$(curl -s -I -m 30 -o /dev/null -w '%{http_code}' "https://storage.yandexcloud.net/$PRIVATE_PATH")
            echo "$PRIVATE_PATH http: $STATUS" >> diag/published.txt
            test "$STATUS" = 403 || test "$STATUS" = 404
          done
          STATUS=$(curl -s -m 30 -X POST "$API_URL" -H 'Content-Type: application/json' -d '{"action":"me","initData":""}' -o /dev/null -w '%{http_code}')
          echo "api without Telegram signature http: $STATUS" >> diag/published.txt
          test "$STATUS" = 401
          cat diag/published.txt

      - name: Состояние вебхука
        if: always() && steps.keys.outputs.ready == 'true' && env.FUNCTION_URL != ''
        env:
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          mkdir -p diag
          sleep 20
          curl -s "https://api.telegram.org/bot$SHOP_BOT_TOKEN/getWebhookInfo" | jq '.result | {url, pending_update_count, last_error_date, last_error_message, max_connections}' > diag/webhookinfo.txt || true
          # Пробный вызов функции без секрета — должен вернуть 403 (значит функция доступна)
          STATUS=$(curl -s -m 30 -o /dev/null -w '%{http_code}' -X POST "$FUNCTION_URL" -d '{}')
          echo "function without secret http: $STATUS" >> diag/webhookinfo.txt
          test "$STATUS" = 403
          SECRET=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':webhook').encode()).hexdigest()[:32])")
          curl -sf -m 60 -X POST "$FUNCTION_URL" -H "X-Telegram-Bot-Api-Secret-Token: $SECRET" -d '{"feedback_probe": true}' > diag/private-probe.json
          jq -e '.owner_configured == true and .private_database == true' diag/private-probe.json > /dev/null

      - name: Диагностика (без секретов)
        if: always() && steps.keys.outputs.ready == 'true'
        run: |
          mkdir -p diag && cd diag
          git init -q && git checkout -q -b ci-shopbot
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "diag ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shopbot
