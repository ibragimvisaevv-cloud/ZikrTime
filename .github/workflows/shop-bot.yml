# Бот-кабинет продавцов магазина: проверка и развёртывание.
# Бот работает на Vercel (вне России — там доступен Telegram), данные и фото — в Yandex Object Storage.
# Нужны секреты: VERCEL_TOKEN, YC_SA_KEY (авторизованный ключ сервисного аккаунта, JSON), YC_FOLDER_ID, SHOP_BOT_TOKEN,
# и по желанию SHOP_OWNER_USERNAME — Telegram-имя владельца (станет владельцем при первом сообщении боту).
name: Shop bot

on:
  push:
    branches: [main]
    paths: ["shop-bot/**", ".github/workflows/shop-bot.yml"]
  workflow_dispatch:
  # Раз в месяц обновляем мечети и молельные комнаты из OpenStreetMap
  schedule:
    - cron: "17 3 1 * *"

permissions:
  contents: write

concurrency:
  group: shop-bot
  cancel-in-progress: false

env:
  BUCKET: zikrtime-shop
  FUNCTION: shop-bot
  RUNTIME_SA: shop-bot-runtime

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Проверка бота
        run: python3 shop-bot/test_bot.py

      - name: Проверка API кабинета
        run: python3 shop-bot/test_miniapi.py

      - name: Проверка мини-приложения (синтаксис)
        run: node --check shop-bot/miniapp/app.js

  deploy:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Есть ли ключи
        id: keys
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          YC_FOLDER_ID: ${{ secrets.YC_FOLDER_ID }}
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          mkdir -p diag
          if [ -z "$YC_SA_KEY" ] || [ -z "$YC_FOLDER_ID" ] || [ -z "$SHOP_BOT_TOKEN" ] || [ -z "$VERCEL_TOKEN" ]; then
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "нет секретов: $( [ -z "$VERCEL_TOKEN" ] && echo VERCEL_TOKEN )" > diag/keys.txt
            echo "### Бот не развёрнут: добавьте секреты VERCEL_TOKEN, YC_SA_KEY, YC_FOLDER_ID, SHOP_BOT_TOKEN" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Yandex Cloud CLI
        if: steps.keys.outputs.ready == 'true'
        env:
          YC_SA_KEY: ${{ secrets.YC_SA_KEY }}
          RAW_FOLDER: ${{ secrets.YC_FOLDER_ID }}  # не YC_FOLDER_ID: эту переменную yc читает сам
        run: |
          mkdir -p diag
          # Проверка ключа без вывода секретов: только имена полей и длины
          printf '%s' "$YC_SA_KEY" > "$RUNNER_TEMP/key.json"
          python3 - "$RUNNER_TEMP/key.json" > diag/key-check.txt 2>&1 <<'PY' || true
          import json, sys
          raw = open(sys.argv[1], encoding="utf-8-sig").read()
          print("длина ключа:", len(raw), "начало:", repr(raw.strip()[:1]), "конец:", repr(raw.strip()[-1:]))
          try:
              k = json.loads(raw)
              print("поля:", sorted(k.keys()))
              print("private_key начинается правильно:", str(k.get("private_key", "")).lstrip().startswith("PLEASE DO NOT REMOVE") or "BEGIN PRIVATE KEY" in str(k.get("private_key", "")))
          except Exception as e:
              print("не JSON:", type(e).__name__, str(e)[:120])
          PY
          # Ключ, скопированный с телефона, бывает с настоящими переносами строк внутри — чиним (strict=False)
          python3 -c "import json,sys;k=json.loads(open(sys.argv[1],encoding='utf-8-sig').read(),strict=False);json.dump(k,open(sys.argv[1],'w'));print('ключ исправлен и прочитан')" "$RUNNER_TEMP/key.json" >> diag/key-check.txt 2>&1 || true
          # В ID каталога могли вставить ссылку целиком — берём то, что после /folders/
          FOLDER=$(python3 -c "import re,sys;t=sys.argv[1].strip();m=re.search(r'folders/([a-z0-9]+)',t);print(m.group(1) if m else re.sub(r'[^a-z0-9]','',t))" "$RAW_FOLDER")
          echo "FOLDER=$FOLDER" >> "$GITHUB_ENV"
          echo "folder id: длина ${#FOLDER}, начало ${FOLDER:0:3}" >> diag/key-check.txt
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -i "$HOME/yc" -n > diag/install.txt 2>&1
          echo "$HOME/yc/bin" >> "$GITHUB_PATH"
          YC="$HOME/yc/bin/yc"
          $YC config profile create ci > diag/yc.txt 2>&1
          $YC config set service-account-key "$RUNNER_TEMP/key.json" >> diag/yc.txt 2>&1
          $YC config set folder-id "$FOLDER" >> diag/yc.txt 2>&1
          $YC resource-manager folder get "$FOLDER" --format json 2>&1 | python3 -c "import sys,json
          t=sys.stdin.read()
          try: print('каталог найден:', json.loads(t).get('name'))
          except Exception: print('ошибка доступа к каталогу:', t[:400])" >> diag/yc.txt

      - name: Хранилище (фото и каталог)
        if: steps.keys.outputs.ready == 'true'
        run: |
          if ! yc storage bucket get --name "$BUCKET" > /dev/null 2>&1; then
            yc storage bucket create --name "$BUCKET" --default-storage-class standard --public-read > diag/bucket.txt 2>&1 || { cat diag/bucket.txt; exit 1; }
          fi
          yc storage bucket update --name "$BUCKET" --public-read > /dev/null 2>> diag/bucket.txt || true
          # Закрытый бакет для базы бота и отзывов на проверке (без публичного чтения)
          if ! yc storage bucket get --name "$BUCKET-data" > /dev/null 2>&1; then
            yc storage bucket create --name "$BUCKET-data" --default-storage-class standard >> diag/bucket.txt 2>&1 || { cat diag/bucket.txt; exit 1; }
          fi

      - name: Сервисный аккаунт функции
        if: steps.keys.outputs.ready == 'true'
        run: |
          if ! yc iam service-account get --name "$RUNTIME_SA" > /dev/null 2>&1; then
            yc iam service-account create --name "$RUNTIME_SA" > diag/sa.txt 2>&1 || { cat diag/sa.txt; exit 1; }
          fi
          SA_ID=$(yc iam service-account get --name "$RUNTIME_SA" --format json 2>> diag/sa.txt | jq -r .id)
          echo "sa id length: ${#SA_ID}" >> diag/sa.txt
          yc resource-manager folder add-access-binding --id "$FOLDER" --role storage.editor \
            --subject "serviceAccount:$SA_ID" >> diag/sa.txt 2>&1 || echo "binding: см. выше" >> diag/sa.txt
          echo "SA_ID=$SA_ID" >> "$GITHUB_ENV"

      - name: Ключ доступа к хранилищу для бота
        if: steps.keys.outputs.ready == 'true'
        run: |
          # Старые ключи удаляем, создаём один свежий
          for k in $(yc iam access-key list --service-account-id "$SA_ID" --format json | jq -r '.[].id'); do
            yc iam access-key delete "$k" > /dev/null 2>&1 || true
          done
          yc iam access-key create --service-account-id "$SA_ID" --description "shop bot on vercel" --format json > "$RUNNER_TEMP/ak.json"
          KEY_ID=$(jq -r .access_key.key_id "$RUNNER_TEMP/ak.json"); SECRET=$(jq -r .secret "$RUNNER_TEMP/ak.json")
          echo "::add-mask::$SECRET"
          echo "S3_KEY_ID=$KEY_ID" >> "$GITHUB_ENV"
          echo "S3_SECRET=$SECRET" >> "$GITHUB_ENV"
          rm "$RUNNER_TEMP/ak.json"

      - name: API кабинета продавца (функция Яндекса — открывается из России без VPN)
        if: steps.keys.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          export IAM_TOKEN=$(yc iam create-token)
          export SA_ID FOLDER BUCKET S3_KEY_ID S3_SECRET API_FUNCTION=shop-api DATA_BUCKET="$BUCKET-data"
          URL=$(python3 shop-bot/deploy_api.py 2> diag/api.txt) || { cat diag/api.txt; exit 1; }
          echo "API_URL=$URL" >> "$GITHUB_ENV"
          echo "api: $URL" >> diag/api.txt

      - name: Мини-приложение и политика конфиденциальности в хранилище
        if: steps.keys.outputs.ready == 'true'
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          sleep 10  # новый ключ хранилища начинает работать не сразу
          python3 shop-bot/upload_miniapp.py > diag/miniapp.txt 2>&1 || { cat diag/miniapp.txt; exit 1; }
          cat diag/miniapp.txt

      - name: Мечети и молельные комнаты из OpenStreetMap
        if: steps.keys.outputs.ready == 'true' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        env:
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          sleep 15  # новый ключ хранилища начинает работать не сразу
          python3 shop-bot/import_osm.py 2>&1 | tail -5 | tee diag/osm.txt

      - name: Бот на Vercel
        if: steps.keys.outputs.ready == 'true'
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.SHOP_OWNER_USERNAME }}
        run: |
          cd shop-bot
          URL=$(npx --yes vercel@latest deploy --prod --yes --token "$VERCEL_TOKEN" \
            -e BOT_TOKEN="$BOT_TOKEN" -e BUCKET="$BUCKET" -e DATA_BUCKET="$BUCKET-data" -e S3_KEY_ID="$S3_KEY_ID" -e S3_SECRET="$S3_SECRET" \
            -e OWNER_USERNAME="${OWNER_USERNAME#@}" 2> ../diag/vercel.txt) || { tail -20 ../diag/vercel.txt; exit 1; }
          cd ..
          HOST=${URL#https://}
          API=https://api.vercel.com
          DEP=$(curl -s -H "Authorization: Bearer $VERCEL_TOKEN" "$API/v13/deployments/$HOST")
          PROJECT=$(echo "$DEP" | jq -r .projectId)
          # Telegram должен достучаться без входа в Vercel — снимаем защиту развёртываний
          curl -s -X PATCH -H "Authorization: Bearer $VERCEL_TOKEN" -H "Content-Type: application/json" \
            "$API/v9/projects/$PROJECT" -d '{"ssoProtection": null}' | jq -c '{name, ssoProtection}' >> diag/vercel.txt
          ALIAS=$(echo "$DEP" | jq -r '[.alias[]? | select(endswith(".vercel.app"))] | sort_by(length) | .[0] // empty')
          BASE=https://${ALIAS:-$HOST}
          echo "deploy: $HOST alias: $ALIAS" >> diag/vercel.txt
          echo "FUNCTION_URL=$BASE/api/webhook" >> "$GITHUB_ENV"

      - name: Подключение к Telegram
        if: steps.keys.outputs.ready == 'true'
        env:
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
          OWNER_USERNAME: ${{ secrets.SHOP_OWNER_USERNAME }}
        run: |
          SECRET=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':webhook').encode()).hexdigest()[:32])")
          API="https://api.telegram.org/bot$SHOP_BOT_TOKEN"
          curl -s "$API/setWebhook" -H 'Content-Type: application/json' -d "{\"url\":\"$FUNCTION_URL\",\"secret_token\":\"$SECRET\",\"max_connections\":1,\"allowed_updates\":[\"message\",\"callback_query\"]}" > diag/webhook.txt
          grep -q '"ok":true' diag/webhook.txt
          curl -sf "$API/setMyCommands" -H 'Content-Type: application/json' \
            -d '{"commands":[{"command":"menu","description":"Главное меню"},{"command":"help","description":"Как это работает"},{"command":"cancel","description":"Отменить шаг"}]}' > /dev/null
          curl -sf "$API/setMyDescription" -H 'Content-Type: application/json' \
            -d '{"description":"Кабинет продавца магазина в приложении «Зикр-тайм»: добавьте свою компанию, товары, цены и фото — после проверки их увидят пользователи приложения."}' > /dev/null
          curl -sf "$API/setMyShortDescription" -H 'Content-Type: application/json' \
            -d '{"short_description":"Добавьте свою компанию в магазин приложения «Зикр-тайм»"}' > /dev/null
          # Кнопка «Кабинет» слева от поля ввода — открывает мини-приложение
          curl -sf "$API/setChatMenuButton" -H 'Content-Type: application/json' \
            -d "{\"menu_button\":{\"type\":\"web_app\",\"text\":\"Кабинет\",\"web_app\":{\"url\":\"https://storage.yandexcloud.net/$BUCKET/miniapp/index.html\"}}}" > diag/menubutton.txt || echo "menu button: fail" > diag/menubutton.txt
          BOT=$(curl -sf "$API/getMe" | jq -r .result.username)
          echo "bot=$BOT" > diag/bot.txt
          echo "webhook=$FUNCTION_URL" >> diag/bot.txt
          [ -z "$OWNER_USERNAME" ] && echo "owner_code=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':owner').encode()).hexdigest()[:8])")" >> diag/bot.txt || echo "owner=by_username" >> diag/bot.txt
          CODE=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':owner').encode()).hexdigest()[:8])")
          {
            echo "### ✅ Бот @$BOT работает"
            echo ""
            echo "Чтобы стать владельцем магазина, напишите боту: \`/owner $CODE\`"
            echo ""
            echo "Каталог для приложения: https://storage.yandexcloud.net/$BUCKET/catalog.json"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Отзывы и перенос базы в закрытый бакет
        if: steps.keys.outputs.ready == 'true'
        env:
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          K=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':cron').encode()).hexdigest()[:32])")
          CRON=${FUNCTION_URL%/api/webhook}/api/cron
          sleep 10
          curl -s -m 70 "$CRON?k=$K&force=1" > diag/cron.txt || echo "cron timeout" >> diag/cron.txt
          cat diag/cron.txt
          # База бота больше не должна открываться по прямой ссылке
          curl -s -o /dev/null -w "public db.json http: %{http_code}\n" "https://storage.yandexcloud.net/$BUCKET/data/db.json" >> diag/cron.txt
          curl -s -o /dev/null -w "private db.json http: %{http_code}\n" "https://storage.yandexcloud.net/$BUCKET-data/data/db.json" >> diag/cron.txt
          curl -s -o /dev/null -w "reviews.json http: %{http_code}\n" "https://storage.yandexcloud.net/$BUCKET/reviews.json" >> diag/cron.txt
          curl -s -o /dev/null -w "miniapp http: %{http_code}\n" "https://storage.yandexcloud.net/$BUCKET/miniapp/index.html" >> diag/cron.txt
          curl -s -m 30 -X POST "$API_URL" -d '{"action":"me","initData":""}' -w "\napi (без подписи должно быть 401): %{http_code}\n" >> diag/cron.txt || echo "api timeout" >> diag/cron.txt

      - name: Состояние вебхука
        if: always() && steps.keys.outputs.ready == 'true'
        env:
          SHOP_BOT_TOKEN: ${{ secrets.SHOP_BOT_TOKEN }}
        run: |
          mkdir -p diag
          sleep 20
          curl -s "https://api.telegram.org/bot$SHOP_BOT_TOKEN/getWebhookInfo" | jq '.result | {url, pending_update_count, last_error_date, last_error_message, max_connections}' > diag/webhookinfo.txt || true
          # Пробный вызов функции без секрета — должен вернуть 403 (значит функция доступна)
          curl -s -o /dev/null -w "function http: %{http_code}\n" -X POST "$FUNCTION_URL" -d '{}' >> diag/webhookinfo.txt || true
          curl -s "https://storage.yandexcloud.net/$BUCKET/catalog.json" -o /dev/null -w "catalog http: %{http_code}\n" >> diag/webhookinfo.txt || true
          SECRET=$(python3 -c "import hashlib,os;print(hashlib.sha256((os.environ['SHOP_BOT_TOKEN']+':webhook').encode()).hexdigest()[:32])")
          echo "probe:" >> diag/webhookinfo.txt
          curl -s -m 60 -X POST "$FUNCTION_URL" -H "X-Telegram-Bot-Api-Secret-Token: $SECRET" -d '{"probe": true}' >> diag/webhookinfo.txt || echo "probe timeout" >> diag/webhookinfo.txt

      - name: Диагностика (без секретов)
        if: always() && steps.keys.outputs.ready == 'true'
        run: |
          mkdir -p diag && cd diag
          git init -q && git checkout -q -b ci-shopbot
          git add -A && git -c user.name=ci -c user.email=ci@local commit -qm "diag ${{ github.run_number }}" || exit 0
          git push -qf "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ci-shopbot
