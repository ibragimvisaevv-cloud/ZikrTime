name: Android mosque details fix 0.8.24
on:
  push:
    branches: [codex/quran-reader-0814]
  workflow_dispatch:
    inputs:
      reuse_verified_apk:
        type: boolean
        description: Recheck the verified 0.8.24 APK without rebuilding Android
        default: false
permissions:
  contents: read
  actions: read
concurrency:
  group: places-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[places-fix]') || contains(github.event.head_commit.message, '[places-recheck]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      REUSE_APK: ${{ inputs.reuse_verified_apk == true || contains(github.event.head_commit.message, '[places-recheck]') }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        if: env.REUSE_APK != 'true'
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: env.REUSE_APK != 'true'
      - name: Verify protected Quran inputs
        run: git diff --exit-code 26a8cd1e9d3a280e9cbfab9a9b8a6ffd97d4b286 -- app/src/main/assets/quran app/src/main/java/com/zikrtime/app/data/QuranContent.kt
      - name: Restore original signing key
        if: env.REUSE_APK != 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
      - name: Build candidate and check places parsing
        if: env.REUSE_APK != 'true'
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.zikrtime.app.data.PlacesTest' --console=plain
          ./gradlew lintDebug assembleDebug assembleRelease --console=plain
      - name: Verify signed candidate
        if: env.REUSE_APK != 'true'
        run: |
          mkdir -p ci-out/screens
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > ci-out/release-signature.txt
          grep -q 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' ci-out/release-signature.txt
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > ci-out/release-badging.txt
          python3 tools/ci/places_fix_delivery.py
      - name: Reuse previously signed and checked APKs
        if: env.REUSE_APK == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code 5a2d37ec087ecc0826ed7b3974ab0b128ea01b83 HEAD -- app/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ gradlew gradlew.bat keystore/release.jks.enc
          gh run download 42382902579 --repo "$GITHUB_REPOSITORY" -n places-fix-verified-inputs -D .
          python3 - <<'PY'
          import hashlib, json, os
          from pathlib import Path
          report = json.loads(Path('ci-out/release-delivery.json').read_text())
          assert report['source_sha'] == '5a2d37ec087ecc0826ed7b3974ab0b128ea01b83'
          assert report['run'] == 42382902579
          assert (report['version'], report['version_code']) == ('0.8.24', 36)
          assert report['certificate_sha256'] == '7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf'
          assert report['quran_assets_unchanged'] and not report['camera_permission']
          for variant, key in [('debug', 'debug_sha256'), ('release', 'apk_sha256')]:
              path = Path(f'app/build/outputs/apk/{variant}/app-{variant}.apk')
              assert hashlib.sha256(path.read_bytes()).hexdigest() == report[key]
          Path('ci-out/recheck.json').write_text(json.dumps({
              'apk_source_sha': report['source_sha'], 'apk_build_run': report['run'],
              'verification_source_sha': os.environ['GITHUB_SHA'],
              'verification_run': int(os.environ['GITHUB_RUN_ID']),
              'unchanged_android_inputs': True, 'both_apk_hashes_verified': True,
          }, indent=2))
          print('Reusing verified 0.8.24 debug/release APKs; original build metadata preserved.')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: places-fix-verified-inputs
          compression-level: 0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            ci-out/release-delivery.json
            ci-out/release-signature.txt
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-places.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mosque details on Android 15
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash tools/ci/places_fix_smoke.sh
      - name: Prepare signed update
        run: cp app/build/outputs/apk/release/app-release.apk ZikrTime-0.8.24.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ZikrTime-0.8.24.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.24-places-check
          path: |
            app/build/reports/
            app/build/test-results/
            ci-out/
