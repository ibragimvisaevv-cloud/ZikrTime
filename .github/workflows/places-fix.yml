name: Android mosque details fix 0.8.24
on:
  push:
    branches: [codex/quran-reader-0814]
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: places-fix-${{ github.ref }}
  cancel-in-progress: false
jobs:
  check:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[places-fix]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify protected Quran inputs
        run: git diff --exit-code 26a8cd1e9d3a280e9cbfab9a9b8a6ffd97d4b286 -- app/src/main/assets/quran app/src/main/java/com/zikrtime/app/data/QuranContent.kt
      - name: Restore original signing key
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
      - name: Build candidate and check places parsing
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.zikrtime.app.data.PlacesTest' --console=plain
          ./gradlew lintDebug assembleDebug assembleRelease --console=plain
      - name: Verify signed candidate
        run: |
          mkdir -p ci-out/screens
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          AAPT=$(find "$ANDROID_HOME/build-tools" -name aapt | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > ci-out/release-signature.txt
          grep -q 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' ci-out/release-signature.txt
          "$AAPT" dump badging app/build/outputs/apk/release/app-release.apk > ci-out/release-badging.txt
          python3 tools/ci/places_fix_delivery.py
      - uses: actions/upload-artifact@v4
        with:
          name: places-fix-verified-inputs
          compression-level: 0
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            app/build/outputs/apk/release/app-release.apk
            ci-out/release-delivery.json
            ci-out/release-signature.txt
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-places.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Mosque details on Android 15
        timeout-minutes: 20
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none -camera-front none
          script: bash tools/ci/places_fix_smoke.sh
      - name: Prepare signed update
        run: cp app/build/outputs/apk/release/app-release.apk ZikrTime-0.8.24.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ZikrTime-0.8.24.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.24-places-check
          path: |
            app/build/reports/
            app/build/test-results/
            ci-out/
