name: Quran reader and feedback check
on:
  push:
    branches: [codex/quran-reader-0814]
    paths-ignore: ['**.md', 'design/**']
permissions:
  contents: write
concurrency:
  group: quran-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, '[quran-ui]') && !contains(github.event.head_commit.message, '[feedback-deploy]') && !contains(github.event.head_commit.message, '[reader-touch]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify complete Quran data and pinned sources
        run: python3 tools/quran/import_quran.py --build && git diff --exit-code -- app/src/main/assets/quran app/src/main/java/com/zikrtime/app/data/QuranContent.kt
      - name: Verify generated translations
        run: python3 tools/i18n/build_strings.py && python3 tools/ci/check_strings.py && git diff --exit-code -- app/src/main/res
      - name: Private feedback and existing bot checks
        run: |
          python3 shop-bot/test_bot.py
          python3 shop-bot/test_miniapi.py
          python3 shop-bot/test_place_corrections.py
          python3 shop-bot/test_feedback.py
          node --check shop-bot/miniapp/app.js
      - name: Verify reader translations
        run: |
          python3 - <<'PY'
          import pathlib, re, xml.etree.ElementTree as ET
          res = pathlib.Path('app/src/main/res')
          def read(path):
              return {x.get('name'): x.text for x in ET.parse(path).getroot()}
          base = read(res / 'values/quran_features.xml')
          for lang in ['ru', 'uz', 'tg', 'kk', 'ky', 'az', 'tr']:
              values = read(res / ('values-' + lang) / 'quran_features.xml')
              assert base.keys() == values.keys(), lang
              for key in base:
                  assert sorted(re.findall(r'%\d+\$[ds]', base[key])) == sorted(re.findall(r'%\d+\$[ds]', values[key])), (lang, key)
          print('47 reader strings checked in 8 languages')
          PY
      - name: Unit tests, lint and debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-quran.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Reading, timer and notes on Android 15
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QURAN_QA_MODE=features bash tools/ci/quran_reader_smoke.sh
      - name: Preserve focused emulator evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/reader_evidence.py
      - name: Package installable APK
        if: success()
        run: |
          cp app/build/outputs/apk/debug/app-debug.apk ZikrTime-0.8.16-test.apk
          sha256sum ZikrTime-0.8.16-test.apk > ci-out/apk-sha256.txt
          stat -c '%s' ZikrTime-0.8.16-test.apk > ci-out/apk-size.txt
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          path: ZikrTime-0.8.16-test.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.16-check
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            ci-out/
