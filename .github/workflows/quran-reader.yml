name: Quran reader and adhan check
on:
  push:
    branches: [codex/quran-reader-0814]
    paths-ignore: ['**.md', 'design/**']
permissions:
  contents: read
concurrency:
  group: quran-reader-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ !contains(github.event.head_commit.message, '[quran-ui]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify complete Quran data and pinned sources
        run: python3 tools/quran/import_quran.py --build && git diff --exit-code -- app/src/main/assets/quran app/src/main/java/com/zikrtime/app/data/QuranContent.kt
      - name: Verify generated translations
        run: python3 tools/i18n/build_strings.py && python3 tools/ci/check_strings.py && git diff --exit-code -- app/src/main/res
      - name: Unit tests, lint and debug APK
        run: chmod +x gradlew && ./gradlew testDebugUnitTest lintDebug assembleDebug --console=plain
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-quran.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Quran and adhan journeys on Android 15
        timeout-minutes: 18
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: QURAN_QA_MODE=layout bash tools/ci/quran_reader_smoke.sh
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.15-check
          path: |
            app/build/outputs/apk/debug/
            app/build/reports/
            app/build/test-results/
            ci-out/
