name: Knowledge levels and tasbih check
on:
  push:
    branches: [codex/quran-reader-0814]
permissions:
  contents: write
concurrency:
  group: learning-tasbih-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ contains(github.event.head_commit.message, '[learning-tasbih]') && !contains(github.event.head_commit.message, '[levels-reuse]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Verify question sources, generated banks and translated controls
        run: |
          python3 tools/quiz/build_quiz.py --check
          python3 -m py_compile tools/ci/levels_tasbih_ui.py
          python3 tools/ci/validate_levels_resources.py
          python3 tools/quran/import_quran.py --build
          git diff --exit-code -- app/src/main/assets/quran app/src/main/java/com/zikrtime/app/data/QuranContent.kt
      - name: Restore original signing key
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          test -f keystore/release.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
      - name: Learning and reward tests, lint and candidate builds
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.zikrtime.app.quiz.*' --tests 'com.zikrtime.app.ProgressLogicTest' --tests 'com.zikrtime.app.ContentTest' --tests 'com.zikrtime.app.data.SourceInfoTest' lintDebug assembleDebug assembleRelease --console=plain
      - name: Verify candidate certificate and payload
        run: |
          mkdir -p ci-out
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > ci-out/release-signature.txt
          grep -q 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' ci-out/release-signature.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          apk = pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          source = pathlib.Path('app/src/main/assets/quran')
          with zipfile.ZipFile(apk) as archive:
              for file in source.rglob('*'):
                  if file.is_file():
                      assert archive.read('assets/quran/' + file.relative_to(source).as_posix()) == file.read_bytes(), str(file)
          pathlib.Path('ci-out/release-delivery.json').write_text(json.dumps({
              'version': '0.8.20', 'version_code': 32, 'source_sha': os.environ['GITHUB_SHA'],
              'run': int(os.environ['GITHUB_RUN_ID']), 'apk_size': apk.stat().st_size,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'certificate_sha256': '7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf',
              'quran_assets_unchanged': True,
          }, indent=2))
          PY
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-quran.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Level selection, rewards and tasbih journeys on Android 15
        timeout-minutes: 14
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/levels_tasbih_smoke.sh
      - name: Preserve synthetic emulator evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/levels_evidence.py
      - name: Prepare signed candidate
        if: success()
        run: cp app/build/outputs/apk/release/app-release.apk ZikrTime-0.8.20-preview.apk
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          path: ZikrTime-0.8.20-preview.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.20-check
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            ci-out/
