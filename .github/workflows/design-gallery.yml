name: Design gallery on verified 0.8.23 APK
on:
  push:
    branches: [codex/quran-reader-0814]
  workflow_dispatch:
permissions:
  contents: write
  actions: read
concurrency:
  group: design-gallery-${{ github.ref }}
  cancel-in-progress: false
jobs:
  gallery:
    if: ${{ github.event_name == 'workflow_dispatch' || contains(github.event.head_commit.message, '[design-gallery]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Retrieve verified APKs and completed checks
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p ci-out
          gh api "repos/$GITHUB_REPOSITORY/actions/artifacts/13573813708" > ci-out/reused-artifact.json
          gh run download 42372494277 -n design-verified-inputs -D verified-inputs
          gh run download 42372494277 -n ZikrTime-0.8.23-check -D previous-check
          python3 tools/ci/design_reuse.py
      - name: Enable emulator acceleration
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-design-gallery.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Complete gallery on a fresh Android 15 emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -no-snapshot -camera-back none
          script: bash tools/ci/design_gallery.sh
      - name: Preserve build and screen evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: python3 tools/ci/design_evidence.py
      - name: Prepare unchanged signed APK
        run: cp app/build/outputs/apk/release/app-release.apk ZikrTime-0.8.23.apk
      - uses: actions/upload-artifact@v7.0.2
        with:
          path: ZikrTime-0.8.23.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.23-gallery
          path: ci-out/
