name: Quran reader layout follow-up
on:
  push:
    branches: [codex/quran-reader-0814]
permissions:
  contents: write
  actions: read
concurrency:
  group: learning-topics-layout-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    if: ${{ contains(github.event.head_commit.message, '[topics-layout]') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      APK_SOURCE_SHA: ${{ contains(github.event.head_commit.message, '[topics-layout-recheck]') && '31b2a1c8f8dc8629d50761e29f9c10314c9ffacd' || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Confirm the previous full run covers unchanged Android inputs
        run: |
          changed=$(git diff --name-only 02cc5ec46fbae5ec51e08802a0c18c8b2808b3e9 HEAD -- app build.gradle.kts settings.gradle.kts gradle.properties gradle gradlew gradlew.bat keystore)
          test "$changed" = "app/src/main/java/com/zikrtime/app/ui/QuranReader.kt"
      - name: Reuse the signed Android build for the emulator recheck
        if: ${{ contains(github.event.head_commit.message, '[topics-layout-recheck]') }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git diff --exit-code "$APK_SOURCE_SHA" HEAD -- app/ tools/i18n/ tools/quiz/ tools/quran/ tools/audio/ build.gradle.kts settings.gradle.kts gradle.properties gradle/ gradlew gradlew.bat keystore/ .gitattributes
          gh run download 41838955090 -n ZikrTime-0.8.21-layout-check -D reused-layout
          mkdir -p app/build ci-out
          cp -R reused-layout/app/build/outputs reused-layout/app/build/reports reused-layout/app/build/test-results app/build/
          cp reused-layout/ci-out/release-delivery.json reused-layout/ci-out/release-signature.txt ci-out/
          sha256sum -c <<'SHA256'
          910ab53858d4f7cc7684dae7110dcc2f0340440f4175c9b4cdc1bc7a1c83906b  app/build/outputs/apk/debug/app-debug.apk
          40a0c2e07122e43f736923e52f4752255142b1a692ea769db0cc914f802cc6a9  app/build/outputs/apk/release/app-release.apk
          SHA256
          python3 -m py_compile tools/ci/learning_topics_ui.py tools/ci/learning_topics_layout_evidence.py
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        if: ${{ !contains(github.event.head_commit.message, '[topics-layout-recheck]') }}
      - name: Restore original signing key
        if: ${{ !contains(github.event.head_commit.message, '[topics-layout-recheck]') }}
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          test -n "$RELEASE_KEY_PASSWORD"
          test -f keystore/release.jks.enc
          openssl enc -d -aes-256-cbc -pbkdf2 -iter 300000 -in keystore/release.jks.enc -out keystore/release.jks -pass env:RELEASE_KEY_PASSWORD
      - name: Relevant Quran tests, lint and rebuilt candidates
        if: ${{ !contains(github.event.head_commit.message, '[topics-layout-recheck]') }}
        env:
          RELEASE_KEY_PASSWORD: ${{ secrets.RELEASE_KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew testDebugUnitTest --tests 'com.zikrtime.app.ContentTest' --tests 'com.zikrtime.app.data.SourceInfoTest' --tests 'com.zikrtime.app.data.QuranTopicsTest' lintDebug assembleDebug assembleRelease --console=plain
      - name: Verify candidate certificate and payload
        if: ${{ !contains(github.event.head_commit.message, '[topics-layout-recheck]') }}
        run: |
          mkdir -p ci-out
          SIGNER=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -1)
          "$SIGNER" verify --verbose --print-certs app/build/outputs/apk/release/app-release.apk > ci-out/release-signature.txt
          grep -q 'certificate SHA-256 digest: 7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf' ci-out/release-signature.txt
          python3 - <<'PY'
          import hashlib, json, os, pathlib, zipfile
          apk = pathlib.Path('app/build/outputs/apk/release/app-release.apk')
          source = pathlib.Path('app/src/main/assets/quran')
          with zipfile.ZipFile(apk) as archive:
              for file in source.rglob('*'):
                  if file.is_file():
                      assert archive.read('assets/quran/' + file.relative_to(source).as_posix()) == file.read_bytes(), str(file)
          pathlib.Path('ci-out/release-delivery.json').write_text(json.dumps({
              'version': '0.8.21', 'version_code': 33, 'source_sha': os.environ['GITHUB_SHA'],
              'run': int(os.environ['GITHUB_RUN_ID']), 'apk_size': apk.stat().st_size,
              'apk_sha256': hashlib.sha256(apk.read_bytes()).hexdigest(),
              'certificate_sha256': '7ae126783c9417f9feeb15e05498eec466f97705f8b1831b4393754108502ccf',
              'quran_assets_unchanged': True,
          }, indent=2))
          PY
      - run: python3 -m pip install 'Pillow>=11,<13'
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm-quran.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Quran topics and compact reader layout on Android 15
        id: ui
        timeout-minutes: 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          disable-animations: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: bash tools/ci/learning_topics_smoke.sh topics-layout
      - name: Preserve synthetic emulator evidence
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          TARGETED_UI_OUTCOME: ${{ steps.ui.outcome }}
        run: python3 tools/ci/learning_topics_layout_evidence.py
      - name: Prepare signed candidate
        if: success()
        run: cp app/build/outputs/apk/release/app-release.apk ZikrTime-0.8.21-preview.apk
      - uses: actions/upload-artifact@v7.0.2
        if: success()
        with:
          path: ZikrTime-0.8.21-preview.apk
          archive: false
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ZikrTime-0.8.21-layout-check
          path: |
            app/build/outputs/apk/
            app/build/reports/
            app/build/test-results/
            ci-out/
