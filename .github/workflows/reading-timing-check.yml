name: Prepare offline recitation marks
on:
  push:
    branches: [codex/reading-store-promos-0828]
    paths: ['.github/workflows/reading-timing-check.yml']
permissions:
  contents: write
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Check publisher audio and bundle word positions
        run: |
          set -euo pipefail
          python3 tools/quran/import_word_timings_51.py
          cp build/reports/quran-word-timings.json tools/quran/source-evidence/0828/word-timing-report-51.json
          git add app/src/main/assets/quran_audio/words tools/quran/source-evidence/0828/word-timing-report-51.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'Pin validated Alafasy word timings for offline reading'
          git push origin HEAD:refs/heads/ci/quran-word-assets-51
