# Проект Xcode собирается из этого файла (XcodeGen): cd ios && xcodegen generate
name: ZikrTime
options:
  bundleIdPrefix: com.zikrtime
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: en
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.8.3"
    CURRENT_PROJECT_VERSION: "15"
    DEVELOPMENT_TEAM: ""
targets:
  ZikrTime:
    configFiles:
      Debug: Local-Debug.xcconfig
      Release: Local-Release.xcconfig
    type: application
    platform: iOS
    sources:
      - path: ZikrTime
      # Общие данные с Android-версией: вопросы, города, шрифт и азан
      - path: ../app/src/main/assets/quiz
        type: folder
        buildPhase: resources
      - path: ../app/src/main/assets/cities.json
        buildPhase: resources
      - path: ../app/src/main/res/font/amiri.ttf
        buildPhase: resources
      - path: ../shared/audio/adhan_short.caf
        buildPhase: resources
      - path: ../shared/audio/adhan_2_short.caf
        buildPhase: resources
      - path: ../shared/audio/adhan_3_short.caf
        buildPhase: resources
      # Встроенная копия каталога магазина (свежая загружается из репозитория ZikrTime-content)
      - path: ../app/src/main/assets/shop/catalog.json
        buildPhase: resources
    info:
      path: ZikrTime/Info.plist
      properties:
        CFBundleDisplayName: ZikrTime
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        CFBundleLocalizations: [en, ru, uz, tg, kk, ky, az, tr]
        LSApplicationCategoryType: public.app-category.lifestyle
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIAppFonts: [amiri.ttf]
        UIRequiresFullScreen: true
        YandexMapKitKey: $(YANDEX_MAPKIT_KEY)
        NSAlarmKitUsageDescription: ZikrTime wakes you up for the Fajr prayer with the adhan at the time you choose.
        NSLocationWhenInUseUsageDescription: Your location helps calculate prayer times, find the qibla direction and show nearby prayer places.
        ITSAppUsesNonExemptEncryption: false
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.zikrtime.ios
        PRODUCT_NAME: ZikrTime
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_STYLE: Automatic
        ENABLE_PREVIEWS: NO
        OTHER_LDFLAGS: $(inherited) -ObjC
