<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="color-scheme" content="light dark"><title>Кабинет продавца · Зикр-тайм</title>
<style>
:root{color-scheme:light;--paper:#f4f1e9;--card:#fffcf5;--ink:#203a32;--muted:#65736b;--line:#dcded4;--green:#245b48;--gold:#977341;--soft:#e9efe5}
*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.55 system-ui,sans-serif}main{width:min(100% - 36px,880px);margin:auto;padding:28px 0 64px}header{padding:8px 0 26px;border-bottom:1px solid var(--line);margin-bottom:24px}
.brand{display:flex;align-items:center;gap:10px;font-size:14px;font-weight:650;color:var(--muted)}.emblem{width:28px;height:28px;border:1px solid var(--gold);border-radius:10px 10px 3px 3px;transform:rotate(45deg);display:inline-block;margin:4px 9px}
h1,h2,h3,p{margin:0}h1{font:400 clamp(30px,7vw,44px)/1.15 Georgia,serif;letter-spacing:-.025em;margin:20px 0 10px}h2{font-size:21px;line-height:1.35}h3{font-size:15px;margin:22px 0 10px}header p{color:var(--muted);max-width:55ch}
section{padding:24px;border:1px solid var(--line);border-radius:20px;background:var(--card);margin:0 0 18px}.login{max-width:520px;margin:auto}.intro{margin:8px 0 22px;color:var(--muted)}.toolbar,.card-head,.row{display:flex;align-items:center;justify-content:space-between;gap:12px}.toolbar{margin-bottom:20px;flex-wrap:wrap}.card-head{align-items:flex-start}.pill{background:var(--soft);padding:5px 10px;border-radius:20px;font-size:12px;color:var(--green);white-space:nowrap}.badge{color:var(--gold);font-size:13px;font-weight:600}
button,.action{font:inherit;border:1px solid transparent;background:var(--green);color:#fff;border-radius:11px;min-height:46px;padding:10px 16px;cursor:pointer;text-decoration:none;display:inline-flex;align-items:center;justify-content:center;transition:background .16s,transform .16s}button:hover,.action:hover{filter:brightness(1.07)}button:active,.action:active{transform:scale(.98)}button:disabled{opacity:.6;cursor:wait}.secondary{color:var(--ink);background:var(--soft);border-color:var(--line)}.text-button{color:var(--green);background:transparent;padding:5px 10px;min-height:42px}button:focus-visible,a:focus-visible,input:focus-visible,summary:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
label{display:block;margin:16px 0 8px;font-size:14px;font-weight:600}input{font:inherit;color:var(--ink);background:var(--paper);border:1px solid var(--line);border-radius:10px;width:100%;padding:12px;min-height:46px;margin-top:6px}.consent{display:flex;gap:10px;align-items:flex-start;font-weight:400;margin:16px 0}input[type=checkbox]{accent-color:var(--green);width:20px;min-height:20px;height:20px;flex-shrink:0;margin:3px 0}a{color:var(--green);text-underline-offset:3px}small,.muted{color:var(--muted)}small{font-size:13px}details{margin-top:20px;color:var(--muted);font-size:14px}summary{cursor:pointer;min-height:36px}
.notice{padding:15px 18px;border-left:3px solid var(--gold);border-radius:0 10px 10px 0;background:var(--soft);margin-bottom:20px}.offers{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px}.offer{border:1px solid var(--line);border-radius:14px;padding:18px;display:flex;flex-direction:column;gap:10px}.offer button{margin-top:auto}.price{font:400 30px/1.2 Georgia,serif;color:var(--gold)}.order{padding:15px 0;border-bottom:1px solid var(--line)}.order:last-child{border-bottom:0}.order small{display:block;margin:5px 0;overflow-wrap:anywhere}.order-actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.payment{border-color:var(--gold)}.payment .action{margin:16px 12px 10px 0}.payment p{margin-top:10px}
#message{position:sticky;bottom:12px;background:var(--ink);color:var(--card);border-radius:12px;padding:14px 18px;box-shadow:0 5px 25px #0002}#message:empty{display:none}.empty{text-align:center;padding:35px 20px}.empty h2{margin-bottom:12px}.loading{color:var(--muted);padding:32px;text-align:center}footer{margin-top:28px;color:var(--muted);font-size:13px}
@media(prefers-color-scheme:dark){:root{color-scheme:dark;--paper:#121b19;--card:#1c2823;--ink:#f0eee3;--muted:#afbab1;--line:#35443b;--green:#9cc6ab;--gold:#d1b783;--soft:#26392f}button,.action{color:#14251c}.secondary,.text-button{color:var(--ink)}#message{background:#e5e9dd;color:#17251e}}
@media(max-width:480px){main{width:calc(100% - 28px);padding-top:18px}section{padding:19px}.card-head{display:block}.pill{display:inline-block;margin-top:10px}.offers{grid-template-columns:1fr}.row{align-items:flex-start}.order .row{gap:8px}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}button:active,.action:active{transform:none}}
</style></head><body>
<main><header><div class="brand"><span class="emblem" aria-hidden="true"></span>Зикр-тайм · Для бизнеса</div><h1>Кабинет продавца</h1><p>Управляйте размещением компании и выбирайте срок продвижения.</p></header>
<div id="view" aria-busy="true"><p class="loading">Открываем кабинет…</p></div><p id="message" role="status" aria-live="polite"></p><footer>Оплата относится к услугам размещения и продвижения в приложении «Зикр-тайм».</footer></main>
<script>
"use strict";
const view = document.getElementById("view"), message = document.getElementById("message");
const labels = {approved:"Опубликована",pending:"На проверке",awaiting_payment:"Можно разместить",hidden:"Скрыта",rejected:"Нужны изменения",initializing:"Создаём счёт",waiting:"Ожидает оплаты",paid:"Оплачен",failed:"Не оплачен",review:"Проверяем оплату",refund_review:"Проверяем возврат",refunded:"Возвращён",test_paid:"Тест завершён"};
const hints = {pending:"Мы проверяем данные компании. Статус обновится здесь после модерации.",rejected:"Откройте карточку в кабинете Telegram, внесите изменения и отправьте её на проверку.",hidden:"Карточка скрыта из каталога. Управлять её видимостью можно в кабинете Telegram."};
let session = "";
try { session = sessionStorage.getItem("zikrtime.seller.session") || ""; } catch (_) {}
function saveSession(value) {
  session=value;
  try {if(value)sessionStorage.setItem("zikrtime.seller.session",value);else sessionStorage.removeItem("zikrtime.seller.session");}catch(_){}
}
function add(parent,tag,text,className) {
  const element=document.createElement(tag);
  if(text!==undefined)element.textContent=text;
  if(className)element.className=className;
  parent.append(element);return element;
}
function button(parent,label,fn,className="") {
  const element=add(parent,"button",label,className);element.type="button";
  element.onclick=async()=>{
    if(element.disabled)return;
    element.disabled=true;message.textContent="";
    try{await fn();}catch(error){message.textContent=error.message;}
    finally{element.disabled=false;}
  };return element;
}
function money(value){return new Intl.NumberFormat("ru-RU",{style:"currency",currency:"RUB",maximumFractionDigits:0}).format(value);}
async function request(op,fields={}) {
  const response=await fetch(location.pathname,{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({...fields,portal:true,op,session})});
  const data=await response.json();
  if(response.status===401&&op!=="login"){saveSession("");login();}
  if(!response.ok)throw Error(data.error||"Не удалось выполнить запрос. Попробуйте ещё раз.");
  return data;
}
function login() {
  view.replaceChildren();view.setAttribute("aria-busy","false");
  const card=add(view,"section",undefined,"login");add(card,"h2","Войдите по одноразовому коду");
  add(card,"p","В кабинете Telegram откройте «Аккаунт» и нажмите «Код входа на сайт». Код действует 5 минут.","intro");
  const label=add(card,"label","Код входа"),input=add(label,"input");input.autocomplete="one-time-code";input.spellcheck=false;input.autocapitalize="none";input.placeholder="Вставьте полученный код";input.required=true;
  const enter=button(card,"Войти в кабинет",async()=>{
    if(!input.reportValidity())return;
    const data=await request("login",{code:input.value.trim()});saveSession(data.session);await show();
  });
  input.addEventListener("keydown",event=>{if(event.key==="Enter")enter.click();});
  const help=add(card,"details");add(help,"summary","Другой способ получить код");add(help,"p","Отправьте команду /webcode личным сообщением боту «Зикр-тайм».");
}
function paymentResult(result,providerName) {
  if(!result.url){message.textContent="Обновите статус заказа. Новый счёт можно создать после завершения предыдущего.";return;}
  const payment=document.createElement("section");payment.className="payment";view.prepend(payment);
  add(payment,"span","Счёт готов","badge");add(payment,"h2","К оплате "+money(result.amount/100));
  add(payment,"p","Откройте платёжную страницу, выберите банк и подтвердите оплату. Затем вернитесь в кабинет.","muted");
  const link=add(payment,"a","Перейти к оплате · "+providerName,"action");link.href=result.url;link.target="_blank";link.rel="noopener noreferrer";
  button(payment,"Проверить оплату",async()=>{await request("sync",{id:result.id});await show();},"secondary");link.focus();
}
function orderRow(parent,order) {
  const row=add(parent,"div",undefined,"order"),head=add(row,"div",undefined,"row");
  const title=order.kind==="listing"?"Размещение компании":"Продвижение на "+order.days+" дней";
  add(head,"strong",title);add(head,"span",money(order.amount/100));
  add(row,"small",(labels[order.state]||order.state)+(order.test?" · тестовый заказ":"")+" · "+new Date(order.created*1000).toLocaleDateString("ru-RU"));
  const info=add(row,"details");add(info,"summary","Номер заказа");add(info,"small",order.id);
  if(["waiting","initializing"].includes(order.state)){
    const actions=add(row,"div",undefined,"order-actions");
    if(order.expires>Date.now()/1000)button(actions,"Продолжить оплату",async()=>{
      const result=await request("resume",{id:order.id});paymentResult(result,order.provider==="robokassa"?"Robokassa · СБП":"Т-Банк");
    },"secondary");
    button(actions,"Обновить статус",async()=>{await request("sync",{id:order.id});await show();},"text-button");
  }
}
async function show() {
  view.setAttribute("aria-busy","true");let data;
  try{data=await request("list");}finally{view.setAttribute("aria-busy","false");}
  view.replaceChildren();
  const toolbar=add(view,"div",undefined,"toolbar");add(toolbar,"span","Мои компании","badge");const actions=add(toolbar,"div");
  button(actions,"Обновить",show,"text-button");button(actions,"Выйти",async()=>{await request("logout");saveSession("");login();},"text-button");
  if(!data.ready)add(view,"p","Приём оплаты готовится к запуску. Здесь уже доступны ваши компании и история заказов.","notice");
  else if(data.test)add(view,"p","Тестовый режим оплаты. Деньги не списываются, размещение и продвижение не включаются.","notice");
  if(!data.shops.length){const empty=add(view,"section",undefined,"empty");add(empty,"h2","Добавьте свою компанию");add(empty,"p","Откройте кабинет Telegram, выберите «Мои компании» → «Добавить компанию». После проверки карточка появится здесь.","muted");return;}
  for(const shop of data.shops){
    const card=add(view,"section"),head=add(card,"div",undefined,"card-head");add(head,"h2",shop.name);add(head,"span",labels[shop.status]||shop.status,"pill");
    if(hints[shop.status])add(card,"p",hints[shop.status],"intro");
    const pending=shop.orders.some(order=>["initializing","waiting","review","refund_review"].includes(order.state));
    if(data.ready&&!pending&&["awaiting_payment","approved"].includes(shop.status)){
      add(card,"p",shop.status==="awaiting_payment"?"Размещение стоит 200 ₽ один раз. Товары внутри карточки включены в стоимость.":"Поднимите компанию в каталоге на выбранный срок. Продвижение отмечается пометкой «Реклама».","intro");
      const email=add(add(card,"label","Электронная почта для чека"),"input");email.type="email";email.required=true;email.autocomplete="email";email.placeholder="name@example.ru";
      const consent=add(card,"label",undefined,"consent"),checked=add(consent,"input");checked.type="checkbox";
      const wording=add(consent,"span","Принимаю условия "),terms=add(wording,"a","оферты");terms.href=data.offer;terms.target="_blank";terms.rel="noopener noreferrer";
      const options=shop.status==="awaiting_payment"?[["listing",0,200]]:Object.entries(data.prices).map(([days,price])=>["promo",Number(days),price]);
      const offers=add(card,"div",undefined,"offers");
      for(const [kind,days,price]of options){
        const offer=add(offers,"div",undefined,"offer"),intent=crypto.randomUUID().replaceAll("-","");
        add(offer,"strong",kind==="listing"?"Карточка компании":days+" дней продвижения");add(offer,"span",money(price),"price");add(offer,"small",kind==="listing"?"Разовый платёж после модерации":"Разовый платёж за выбранный срок");
        button(offer,data.test?"Проверить тестовую оплату":"Оплатить",async()=>{
          if(!email.reportValidity())return;
          if(!checked.checked){checked.focus();throw Error("Примите условия оферты, чтобы перейти к оплате.");}
          const result=await request("buy",{sid:shop.sid,kind,days,email:email.value.trim(),offer:data.offer,intent});
          await show();paymentResult(result,data.provider_name);
        });
      }
    }
    if(shop.orders.length){add(card,"h3","История заказов");for(const order of shop.orders)orderRow(card,order);}
  }
}
if(session){show().catch(error=>{message.textContent=error.message;if(session){view.replaceChildren();button(view,"Повторить",show,"secondary");}});}else login();
</script></body></html>
